<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2942" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="innerShield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Navy Shield -->
  <path d="M 250 20 C 370 60 440 90 440 230 C 440 360 330 440 250 480 C 170 440 60 360 60 230 C 60 90 130 60 250 20 Z" 
        fill="url(#shieldGrad)" filter="url(#shadow)" />

  <!-- Inner White Shield Frame -->
  <path d="M 250 38 C 355 74 420 100 420 226 C 420 344 322 418 250 454 C 178 418 80 344 80 226 C 80 100 145 74 250 38 Z" 
        fill="#ffffff" />

  <!-- Inner Green Border Shield -->
  <path d="M 250 50 C 345 84 405 108 405 222 C 405 332 312 400 250 435 C 188 400 95 332 95 222 C 95 108 155 84 250 50 Z" 
        fill="none" stroke="url(#greenGrad)" stroke-width="12" />

  <!-- Top Curved Text - ABDULKAREM -->
  <path id="textPathTop" d="M 120 160 A 170 170 0 0 1 380 160" fill="none" />
  <text font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="34" fill="#0f2942" text-anchor="middle">
    <textPath href="#textPathTop" startOffset="50%">ABDULKAREM</textPath>
  </text>

  <!-- Factory & Construction Silhouettes -->
  <g fill="#0f2942">
    <!-- Factory Chimney & Building Left -->
    <rect x="130" y="210" width="18" height="60" />
    <path d="M 125 210 Q 139 195 145 200 Q 155 190 160 195" fill="none" stroke="#0f2942" stroke-width="4" />
    <rect x="155" y="225" width="22" height="45" />
    <polygon points="177,235 200,235 200,270 177,270" />
    <!-- Windows -->
    <rect x="135" y="225" width="8" height="8" fill="#ffffff" />
    <rect x="135" y="240" width="8" height="8" fill="#ffffff" />
    <rect x="162" y="235" width="8" height="8" fill="#ffffff" />

    <!-- Crane Right -->
    <rect x="340" y="185" width="8" height="85" />
    <polygon points="300,200 375,200 344,185" fill="none" stroke="#0f2942" stroke-width="4" />
    <line x1="300" y1="200" x2="300" y2="225" stroke="#0f2942" stroke-width="3" />
    <rect x="296" y="225" width="8" height="12" />
  </g>

  <!-- Safety Helmet -->
  <path d="M 205 195 C 205 160 295 160 295 195 Z" fill="#0f2942" />
  <path d="M 195 195 L 305 195 L 300 202 L 200 202 Z" fill="#0f2942" />
  <rect x="235" y="165" width="30" height="25" rx="3" fill="#10b981" />

  <!-- Center Safety Shield with Checkmark -->
  <g transform="translate(195, 210)">
    <path d="M 55 5 C 80 15 100 22 100 55 C 100 85 75 105 55 118 C 35 105 10 85 10 55 C 10 22 30 15 55 5 Z" 
          fill="url(#innerShield)" filter="url(#shadow)" />
    <path d="M 55 12 C 75 20 92 27 92 55 C 92 80 70 98 55 108 C 40 98 18 80 18 55 C 18 27 35 20 55 12 Z" 
          fill="none" stroke="#ffffff" stroke-width="3" />
    <!-- White Checkmark -->
    <path d="M 36 56 L 48 68 L 74 40" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- SAFETY BOARD Banner Base -->
  <rect x="100" y="325" width="300" height="48" rx="8" fill="#0f2942" />
  <text x="250" y="360" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="30" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    SAFETY BOARD
  </text>

  <!-- Subtitle -->
  <rect x="140" y="380" width="220" height="24" rx="4" fill="#10b981" />
  <text x="250" y="396" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="12" fill="#ffffff" text-anchor="middle" letter-spacing="1">
    INDUSTRIAL SAFETY &amp; EHS
  </text>
</svg>
