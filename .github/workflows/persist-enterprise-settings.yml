name: Persist Enterprise Settings

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[enterprise-persist]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch DataContext and Settings persistence
        shell: python
        run: |
          from pathlib import Path

          dc = Path('src/lib/data-context.tsx')
          s = dc.read_text(encoding='utf-8')
          if 'enterpriseConfig?: Record<string,any>;' not in s:
              s = s.replace(
                  'logoPosition:\'left\'|\'center\'|\'right\'; heroTitleEn?:string;',
                  "logoPosition:'left'|'center'|'right'; enterpriseConfig?: Record<string,any>; heroTitleEn?:string;"
              )
              dc.write_text(s, encoding='utf-8')

          p = Path('src/pages/admin/settings.tsx')
          s = p.read_text(encoding='utf-8')
          marker = '// ENTERPRISE_PERSIST_V1'
          if marker in s:
              raise SystemExit(0)

          # Load saved enterprise configuration from the site_settings.branding JSON.
          anchor = '  const isAr = settings.language === "ar";\n'
          inject = '''  const isAr = settings.language === "ar";\n  // ENTERPRISE_PERSIST_V1\n  const savedEnterpriseConfig = (settings.branding?.enterpriseConfig || {}) as any;\n  const [enterpriseReady, setEnterpriseReady] = useState(false);\n'''
          if anchor in s:
              s = s.replace(anchor, inject, 1)

          # Make initial state hydrate from persisted values after remote settings arrive.
          anchor = '  const [activeTab, setActiveTab] = useState("company");\n'
          inject = '''  const [activeTab, setActiveTab] = useState("company");\n\n  useEffect(() => {\n    if (enterpriseReady) return;\n    const cfg = savedEnterpriseConfig;\n    if (cfg.numbering) setNumbering(prev => ({ ...prev, ...cfg.numbering }));\n    if (cfg.qrConfig) setQrConfig(prev => ({ ...prev, ...cfg.qrConfig }));\n    if (cfg.pdfConfig) setPdfConfig(prev => ({ ...prev, ...cfg.pdfConfig }));\n    if (Array.isArray(cfg.jobTitles)) setJobTitles(cfg.jobTitles);\n    if (Array.isArray(cfg.incidentCats)) setIncidentCats(cfg.incidentCats);\n    if (Array.isArray(cfg.trainingCats)) setTrainingCats(cfg.trainingCats);\n    if (Array.isArray(cfg.permitTypes)) setPermitTypes(cfg.permitTypes);\n    if (Array.isArray(cfg.lotoCats)) setLotoCats(cfg.lotoCats);\n    if (cfg.companyData) setCompanyData(prev => ({ ...prev, ...cfg.companyData }));\n    if (cfg.brandingText) setBrandingText(prev => ({ ...prev, ...cfg.brandingText }));\n    setEnterpriseReady(true);\n  }, [enterpriseReady, savedEnterpriseConfig]);\n'''
          if anchor in s:
              s = s.replace(anchor, inject, 1)

          # Replace handleSaveAll so every settings tab is persisted in one DB-backed JSON document.
          start = s.find('  const handleSaveAll = () => {')
          if start >= 0:
              end = s.find('\n  const handleAddFactory', start)
              if end > start:
                  new_fn = '''  const handleSaveAll = async () => {\n    try {\n      await updateSettings({\n        ...localSettings,\n        branding: {\n          companyName: companyData.name,\n          companyLogo: companyData.logoUrl,\n          companyAddress: companyData.address,\n          companyPhone: companyData.phone,\n          companyEmail: companyData.email,\n          companyWebsite: companyData.website,\n          documentFooter: pdfConfig.confidentialFooter,\n          confidentialLabel: pdfConfig.watermarkText,\n          departmentName: "Health, Safety & Environment",\n          safetyDepartmentName: "Corporate Safety & Risk Control",\n          logoPosition: pdfConfig.headerLogoPosition,\n          ...brandingText,\n          enterpriseConfig: {\n            numbering,\n            qrConfig,\n            pdfConfig,\n            jobTitles,\n            incidentCats,\n            trainingCats,\n            permitTypes,\n            lotoCats,\n            companyData,\n            brandingText,\n          },\n        },\n      });\n      toast.success(isAr ? "تم حفظ جميع إعدادات المؤسسة في قاعدة البيانات" : "All enterprise settings saved to the database");\n    } catch (e: any) {\n      toast.error(e?.message || (isAr ? "تعذر حفظ إعدادات المؤسسة" : "Unable to save enterprise settings"));\n    }\n  };\n'''
                  s = s[:start] + new_fn + s[end:]

          p.write_text(s, encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/data-context.tsx src/pages/admin/settings.tsx
          git commit -m 'fix: persist enterprise settings across refresh [enterprise-persist]'
          git push
