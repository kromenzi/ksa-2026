name: Repair data context and safety signs JSX

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Restore empty data context and repair Safety Signs source
        shell: bash
        run: |
          set -euo pipefail
          changed=0

          if [ ! -s src/lib/data-context.tsx ]; then
            git checkout 861df2576a16bc0b4215d5f6594716ff426a5e33 -- src/lib/data-context.tsx
            changed=1
          fi

          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/admin/safety-signs/index.tsx')
          s = p.read_text(encoding='utf-8')

          old_select = '<SelectContent><SelectItem value="a4-portrait">A4 Portrait</SelectItem><SelectItem value="a4-landscape">A4 Landscape</SelectItem><SelectItem value="a3-portrait">A3 Portrait</SelectItem><SelectItem value="a3-landscape">A3 Landscape</SelectItem><SelectItem value="custom">Custom Industrial</SelectItem></SelectContent></div></DialogHeader>'
          new_select = '<SelectContent><SelectItem value="a4-portrait">A4 Portrait</SelectItem><SelectItem value="a4-landscape">A4 Landscape</SelectItem><SelectItem value="a3-portrait">A3 Portrait</SelectItem><SelectItem value="a3-landscape">A3 Landscape</SelectItem><SelectItem value="custom">Custom Industrial</SelectItem></SelectContent></Select></div></DialogHeader>'
          if old_select in s:
              s = s.replace(old_select, new_select, 1)

          old_cfg = 'cfgClass(CATEGORY_CONFIGS[sign.category]||CATEGORY_CONFIGS.General)'
          new_cfg = '(CATEGORY_CONFIGS[sign.category]||CATEGORY_CONFIGS.General).badgeBg'
          if old_cfg in s:
              s = s.replace(old_cfg, new_cfg, 1)

          p.write_text(s, encoding='utf-8')
          PY

          if ! git diff --quiet -- src/lib/data-context.tsx src/pages/admin/safety-signs/index.tsx; then
            changed=1
          fi

          if [ "$changed" -eq 1 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/lib/data-context.tsx src/pages/admin/safety-signs/index.tsx
            git commit -m 'chore: repair safety signs build errors'
            git push origin main
          else
            echo 'No repair needed.'
          fi
