name: Apply SOR escalation linkage

on:
  push:
    branches:
      - feat/sor-escalation-linkage
    paths:
      - scripts/add-sor-escalation-linkage.py
      - .github/workflows/apply-sor-escalation-linkage.yml

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: feat/sor-escalation-linkage
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply SOR escalation and outcome linkage patch
        run: python scripts/add-sor-escalation-linkage.py

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Commit generated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/escalations/index.ts src/pages/admin/reports.tsx src/pages/admin/dashboard.tsx src/pages/admin/safety-pyramid.tsx src/components/incident-pyramid.tsx src/lib/safety-outcome.ts
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "feat: add SOR escalation and sync safety outcomes"
            git push origin HEAD:feat/sor-escalation-linkage
          fi
