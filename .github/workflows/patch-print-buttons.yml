name: Patch pyramid print buttons

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch print handlers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('src/pages/admin/safety-pyramid.tsx')
          text = page.read_text(encoding='utf-8')

          if 'const printVisualPyramid = () =>' not in text:
              marker = '  const print = () => { logActivity("Print Incident Pyramid", `Printed ${monthName} ${selectedYear} Monthly vs YTD`, "reports"); window.print(); };\n'
              fn = '''  const printVisualPyramid = () => {\n    const levels = LEVELS.map((l, i) => ({ id: l.id, nameEn: l.en, nameAr: l.ar, order: i + 1 }));\n    const countsParam = LEVELS.map((l) => ({ id: l.id, monthly: counts.monthly[l.id], ytd: counts.ytd[l.id] }));\n    const params = new URLSearchParams({\n      lang: isAr ? "ar" : "en",\n      month: monthName,\n      year: String(selectedYear),\n      levels: JSON.stringify(levels),\n      counts: JSON.stringify(countsParam),\n      incidents: String(counts.monthly.fatality + counts.monthly.lostTime + counts.monthly.restrictedWork + counts.monthly.medicalTreatment + counts.monthly.firstAid),\n      nearMisses: String(counts.monthly.nearMiss),\n      observations: String(counts.monthly.unsafeActs),\n    });\n    logActivity("Print Incident Pyramid Visual", `Opened ${monthName} ${selectedYear} Monthly vs YTD visual pyramid`, "reports");\n    window.open(`/admin/safety-pyramid-print?${params.toString()}`, "_blank", "noopener,noreferrer");\n  };\n'''
              if marker not in text:
                  raise SystemExit('marker for print handler not found')
              text = text.replace(marker, marker + fn)

          old = '<Button onClick={print} className="rounded-xl gap-2 bg-red-600 hover:bg-red-700 text-white"><Printer className="h-4 w-4" />{isAr ? "طباعة" : "Print / PDF"}</Button>'
          new = '<Button variant="outline" onClick={print} className="rounded-xl gap-2"><Printer className="h-4 w-4" />{isAr ? "طباعة تقرير" : "Print Report"}</Button><Button onClick={printVisualPyramid} className="rounded-xl gap-2 bg-red-600 hover:bg-red-700 text-white"><Printer className="h-4 w-4" />{isAr ? "طباعة الهرم" : "Print Pyramid"}</Button>'
          if old in text:
              text = text.replace(old, new)
          elif 'Print Pyramid' not in text:
              raise SystemExit('print button markup not found')

          page.write_text(text, encoding='utf-8')

          comp = Path('src/components/incident-pyramid.tsx')
          c = comp.read_text(encoding='utf-8')
          old_fn = '  const handlePrintPyramid = () => {\n    window.print();\n  };'
          new_fn = '''  const handlePrintPyramid = () => {\n    const levels = PYRAMID_LEVEL_DEFS.map((lvl) => ({ id: lvl.id, nameEn: lvl.nameEn, nameAr: lvl.nameAr, order: lvl.order }));\n    const counts = PYRAMID_LEVEL_DEFS.map((lvl) => ({ id: lvl.id, monthly: monthlyCounts[lvl.id] || 0, ytd: ytdCounts[lvl.id] || 0 }));\n    const params = new URLSearchParams({\n      lang: isAr ? "ar" : "en",\n      month: monthNameText,\n      year: String(selectedYear),\n      levels: JSON.stringify(levels),\n      counts: JSON.stringify(counts),\n      incidents: String(totalMonthlyIncidents),\n      nearMisses: String(monthlyCounts.nearMiss || 0),\n      observations: String(monthlyCounts.unsafeActs || 0),\n    });\n    window.open(`/admin/safety-pyramid-print?${params.toString()}`, "_blank", "noopener,noreferrer");\n  };'''
          if old_fn in c:
              c = c.replace(old_fn, new_fn)
          comp.write_text(c, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/safety-pyramid.tsx src/components/incident-pyramid.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: keep report print and isolate visual pyramid print"
          git push origin main
