name: Production E2E

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * *"

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_BASE_URL: https://abdulkarem-board-2026.vercel.app
    steps:
      - uses: actions/checkout@v4

      - name: Wait for production deployment
        if: github.event_name == 'push'
        shell: bash
        run: |
          for i in {1..40}; do
            BODY="$(curl -fsS "$E2E_BASE_URL/api/health" || true)"
            VERSION="$(printf '%s' "$BODY" | python -c 'import json,sys; 
try: print(json.load(sys.stdin).get("version",""))
except Exception: print("")')"
            if [ "$VERSION" = "$GITHUB_SHA" ]; then
              echo "Production is serving $GITHUB_SHA"
              exit 0
            fi
            echo "Waiting for production... current=$VERSION expected=$GITHUB_SHA"
            sleep 15
          done
          echo "Production did not reach expected commit in time"
          exit 1

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production smoke tests
        run: npx playwright test tests/e2e/production-smoke.spec.cjs --project=chromium --reporter=line
