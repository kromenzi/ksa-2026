name: Apply Final Safety Board Fixes
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair pyramid printers
        run: python3 scripts/repair-pyramid-print-v9.py
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/safety-pyramid.tsx src/components/incident-pyramid.tsx
          if git diff --cached --quiet; then
            echo "No source changes"
            exit 0
          fi
          git commit -m "fix: make pyramid printing non-blank"
          git push
