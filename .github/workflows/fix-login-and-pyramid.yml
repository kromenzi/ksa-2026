name: Fix Login Language and Pyramid Print

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch source
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          # Login language: use DataProvider's local/persistent toggle so it works before auth.
          login = Path('src/pages/admin/login.tsx')
          text = login.read_text(encoding='utf-8')
          text = text.replace(
              'const { login, logout, isAuthenticated, settings, updateSettings } = useData();',
              'const { login, logout, isAuthenticated, settings, toggleLanguage, updateSettings } = useData();'
          )
          text = re.sub(
              r'\n  const toggleLanguage = \(\) => void updateSettings\(\{ language: settings\.language === "en" \? "ar" : "en" \}\);',
              '',
              text,
              count=1,
          )
          login.write_text(text, encoding='utf-8')

          # Visual pyramid print: bypass generic report dialog and print the actual pyramid shape.
          pyramid = Path('src/pages/admin/safety-pyramid.tsx')
          text = pyramid.read_text(encoding='utf-8')
          marker = 'VISUAL_PYRAMID_DIRECT_PRINT_V3'
          replacement = r'''  const handlePrint = () => {
    // VISUAL_PYRAMID_DIRECT_PRINT_V3
    const enabledLevels = pyramidLevels
      .filter(lvl => lvl.enabled)
      .sort((a, b) => a.order - b.order);

    if (enabledLevels.length === 0) {
      toast.error(isAr ? "لا توجد مستويات مفعلة للطباعة" : "No enabled pyramid levels to print");
      return;
    }

    const colors = ["#991b1b", "#dc2626", "#f59e0b", "#eab308", "#f97316", "#2563eb", "#059669"];
    const escapeHtml = (value: string) => String(value).replace(/[&<>\"']/g, ch => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '\"': "&quot;", "'": "&#39;"
    }[ch] || ch));

    const center = 450;
    const topWidth = 120;
    const bottomWidth = 760;
    const segmentHeight = 88;
    const topY = 150;
    const widthStep = enabledLevels.length > 1
      ? (bottomWidth - topWidth) / (enabledLevels.length - 1)
      : 0;

    const polygons = enabledLevels.map((lvl, index) => {
      const currentTop = topWidth + widthStep * index;
      const currentBottom = index === enabledLevels.length - 1
        ? bottomWidth
        : topWidth + widthStep * (index + 1);
      const y = topY + index * segmentHeight;
      const x1 = center - currentTop / 2;
      const x2 = center + currentTop / 2;
      const x3 = center + currentBottom / 2;
      const x4 = center - currentBottom / 2;
      const label = isAr ? lvl.nameAr : lvl.nameEn;
      const count = getLevelCount(lvl.id);
      const labelSize = label.length > 26 ? 13 : 16;
      return `
        <polygon points="${x1},${y} ${x2},${y} ${x3},${y + segmentHeight} ${x4},${y + segmentHeight}"
          fill="${colors[index % colors.length]}" stroke="#ffffff" stroke-width="4"/>
        <text x="${center}" y="${y + 35}" text-anchor="middle" font-size="${labelSize}"
          font-family="Arial, Segoe UI, sans-serif" font-weight="700" fill="#ffffff">${escapeHtml(label)}</text>
        <text x="${center}" y="${y + 67}" text-anchor="middle" font-size="25"
          font-family="Arial, Segoe UI, sans-serif" font-weight="800" fill="#ffffff">${count}</text>`;
    }).join("");

    const title = isAr ? "الهرم الأمني الديناميكي" : "Dynamic Safety Pyramid";
    const subtitle = isAr
      ? "التقرير المرئي لمستويات الحوادث والوقائع والملاحظات"
      : "Visual report of incidents, near misses and safety observations";
    const dateText = new Date().toLocaleDateString(isAr ? "ar-SA" : "en-US");
    const direction = isAr ? "rtl" : "ltr";
    const svgHeight = topY + enabledLevels.length * segmentHeight + 30;

    const printWindow = window.open("", "_blank", "width=1100,height=1000");
    if (!printWindow) {
      toast.error(isAr ? "اسمح بالنوافذ المنبثقة حتى يمكن طباعة الهرم" : "Allow pop-ups so the pyramid can be printed");
      return;
    }

    const html = `<!doctype html>
<html lang="${isAr ? "ar" : "en"}" dir="${direction}">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>${escapeHtml(title)}</title>
<style>
  @page { size: A4 portrait; margin: 8mm; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #fff; color: #111827; }
  body { font-family: Arial, "Segoe UI", sans-serif; }
  .sheet { width: 100%; max-width: 794px; margin: 0 auto; padding: 8px; }
  .header { display: flex; justify-content: space-between; gap: 20px; align-items: flex-start; border-bottom: 3px solid #dc2626; padding-bottom: 12px; margin-bottom: 12px; }
  .title { font-size: 24px; font-weight: 800; line-height: 1.2; margin: 0; }
  .subtitle { color: #64748b; font-size: 12px; margin: 5px 0 0; }
  .meta { color: #475569; font-size: 11px; text-align: ${isAr ? "left" : "right"}; white-space: nowrap; }
  .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0 10px; }
  .summary-card { border: 1px solid #e2e8f0; border-radius: 8px; padding: 9px; text-align: center; background: #f8fafc; }
  .summary-card strong { display: block; font-size: 21px; color: #0f172a; }
  .summary-card span { display: block; font-size: 10px; color: #64748b; margin-top: 2px; }
  .pyramid { width: 100%; display: flex; justify-content: center; align-items: center; }
  svg { display: block; width: 100%; height: auto; }
  .footer { border-top: 1px solid #e2e8f0; margin-top: 10px; padding-top: 7px; display: flex; justify-content: space-between; gap: 12px; color: #64748b; font-size: 9px; }
  @media print { .sheet { max-width: none; padding: 0; } }
</style>
</head>
<body>
  <div class="sheet">
    <div class="header">
      <div>
        <h1 class="title">${escapeHtml(title)}</h1>
        <p class="subtitle">${escapeHtml(subtitle)}</p>
      </div>
      <div class="meta">HSE-PYRAMID-01<br/>${escapeHtml(dateText)}</div>
    </div>

    <div class="summary">
      <div class="summary-card"><strong>${totalIncidents}</strong><span>${isAr ? "إجمالي الحوادث" : "Total Incidents"}</span></div>
      <div class="summary-card"><strong>${totalNearMisses}</strong><span>${isAr ? "الوقائع الوشيكة" : "Near Misses"}</span></div>
      <div class="summary-card"><strong>${totalObservations}</strong><span>${isAr ? "الأفعال والظروف غير الآمنة" : "Unsafe Acts & Conditions"}</span></div>
    </div>

    <div class="pyramid">
      <svg viewBox="0 0 900 ${svgHeight}" role="img" aria-label="${escapeHtml(title)}" preserveAspectRatio="xMidYMid meet">
        ${polygons}
      </svg>
    </div>

    <div class="footer">
      <span>${isAr ? "تم إنشاء التقرير من ABDULKAREM SAFETY BOARD" : "Generated by ABDULKAREM SAFETY BOARD"}</span>
      <span>${escapeHtml(title)}</span>
    </div>
  </div>

  <script>
    window.addEventListener("load", function () {
      setTimeout(function () {
        window.focus();
        window.print();
      }, 250);
    });
  </script>
</body>
</html>`;

    printWindow.document.open();
    printWindow.document.write(html);
    printWindow.document.close();
    logActivity("Print Safety Pyramid", "Printed visual safety pyramid", "reports");
  };

'''

    if marker not in text:
      pattern = r'  const handlePrint = \(\) => \{.*?\n  \};\n\n  const exportCSV = \(\) => \{'
      patched, count = re.subn(pattern, replacement + '  const exportCSV = () => {', text, count=1, flags=re.S)
      if count != 1:
        raise SystemExit("Could not locate safety pyramid handlePrint")
      text = patched
      pyramid.write_text(text, encoding='utf-8')
      print('Patched visual pyramid print')
    else:
      print('Visual pyramid print already patched')

          PY

      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/login.tsx src/pages/admin/safety-pyramid.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: make login language and pyramid print work"
          git push
