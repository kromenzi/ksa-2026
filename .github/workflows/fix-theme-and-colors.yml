name: Fix Theme And Color Switching

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[theme-colors-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch theme and color state
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/lib/data-context.tsx')
          s = p.read_text(encoding='utf-8')

          old_state = ''' const [localLanguage,setLocalLanguage]=useState<"en"|"ar">(()=>{try{return localStorage.getItem("safety-board-language") === "ar" ? "ar" : "en";}catch{return "en";}});'''
          new_state = ''' const [localLanguage,setLocalLanguage]=useState<"en"|"ar">(()=>{try{return localStorage.getItem("safety-board-language") === "ar" ? "ar" : "en";}catch{return "en";}});\n const [localTheme,setLocalTheme]=useState<"light"|"dark">(()=>{try{const saved=localStorage.getItem("safety-board-theme");return saved === "light" ? "light" : "dark";}catch{return "dark";}});\n const [localColorTheme,setLocalColorTheme]=useState<ColorTheme>(()=>{try{const saved=localStorage.getItem("safety-board-color-theme");return saved === "ocean" || saved === "violet" || saved === "emerald" ? saved : "emerald";}catch{return "emerald";}});'''
          if old_state not in s:
              raise SystemExit('state marker not found')
          s = s.replace(old_state, new_state, 1)

          old_settings = ''' const settings={...emptySettings,...remoteSettings,language:localLanguage};'''
          new_settings = ''' const settings={...emptySettings,...remoteSettings,language:localLanguage,theme:localTheme,colorTheme:localColorTheme};\n useEffect(()=>{\n   const root=document.documentElement;\n   root.classList.toggle("dark",localTheme === "dark");\n   root.style.colorScheme=localTheme;\n   root.classList.remove("theme-ocean","theme-emerald","theme-violet");\n   root.classList.add(`theme-${localColorTheme}`);\n },[localTheme,localColorTheme]);\n useEffect(()=>{\n   try{\n     const savedTheme=localStorage.getItem("safety-board-theme");\n     if(savedTheme !== "light" && savedTheme !== "dark" && (remoteSettings.theme === "light" || remoteSettings.theme === "dark")){\n       setLocalTheme(remoteSettings.theme);\n     }\n     const savedColor=localStorage.getItem("safety-board-color-theme");\n     if(savedColor !== "ocean" && savedColor !== "emerald" && savedColor !== "violet" && (remoteSettings.colorTheme === "ocean" || remoteSettings.colorTheme === "emerald" || remoteSettings.colorTheme === "violet")){\n       setLocalColorTheme(remoteSettings.colorTheme);\n     }\n   }catch{}\n },[remoteSettings.theme,remoteSettings.colorTheme]);'''
          if old_settings not in s:
              raise SystemExit('settings marker not found')
          s = s.replace(old_settings, new_settings, 1)

          old_update = ''' const updateSettings=async(d:Partial<SiteSettings>)=>{if(d.language==="ar"||d.language==="en"){setLocalLanguage(d.language);try{localStorage.setItem("safety-board-language",d.language);}catch{}}try{await apiRequest("PATCH","/api/site-settings",d);}catch{}invalidate("/api/site-settings");};'''
          new_update = ''' const updateSettings=async(d:Partial<SiteSettings>)=>{if(d.language==="ar"||d.language==="en"){setLocalLanguage(d.language);try{localStorage.setItem("safety-board-language",d.language);}catch{}} if(d.theme==="light"||d.theme==="dark"){setLocalTheme(d.theme);try{localStorage.setItem("safety-board-theme",d.theme);}catch{}} if(d.colorTheme==="ocean"||d.colorTheme==="emerald"||d.colorTheme==="violet"){setLocalColorTheme(d.colorTheme);try{localStorage.setItem("safety-board-color-theme",d.colorTheme);}catch{}} try{await apiRequest("PATCH","/api/site-settings",d);}catch{} invalidate("/api/site-settings");};'''
          if old_update not in s:
              raise SystemExit('updateSettings marker not found')
          s = s.replace(old_update, new_update, 1)

          old_toggle = ''' const toggleTheme=()=>{void updateSettings({theme:settings.theme==="dark"?"light":"dark"})};'''
          new_toggle = ''' const toggleTheme=()=>{const next=localTheme === "dark" ? "light" : "dark";setLocalTheme(next);try{localStorage.setItem("safety-board-theme",next);}catch{};void apiRequest("PATCH","/api/site-settings",{theme:next}).then(()=>invalidate("/api/site-settings")).catch(()=>{});};'''
          if old_toggle in s:
              s = s.replace(old_toggle, new_toggle, 1)

          old_color = ''' const setColorTheme=(t:ColorTheme)=>{void updateSettings({colorTheme:t});};'''
          new_color = ''' const setColorTheme=(t:ColorTheme)=>{setLocalColorTheme(t);try{localStorage.setItem("safety-board-color-theme",t);}catch{};void apiRequest("PATCH","/api/site-settings",{colorTheme:t}).then(()=>invalidate("/api/site-settings")).catch(()=>{});};'''
          if old_color in s:
              s = s.replace(old_color, new_color, 1)

          p.write_text(s, encoding='utf-8')

      - name: Verify patch
        shell: python
        run: |
          from pathlib import Path
          s = Path('src/lib/data-context.tsx').read_text(encoding='utf-8')
          required = [
            'localTheme',
            'localColorTheme',
            'safety-board-theme',
            'safety-board-color-theme',
            'root.classList.toggle("dark",localTheme === "dark")',
            'theme-ocean',
            'theme-emerald',
            'theme-violet'
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit(f'Missing theme/color markers: {missing}')

      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/data-context.tsx
          git commit -m 'fix: make light dark and color theme switching functional [theme-colors-fixed]'
          git push

      - name: Remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-theme-and-colors.yml
          git add .github/workflows/fix-theme-and-colors.yml
          git commit -m 'chore: remove theme and color repair workflow' || true
          git push
