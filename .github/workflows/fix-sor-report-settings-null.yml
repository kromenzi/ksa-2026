name: Fix SOR report settings null handling

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch DataContext report settings
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/lib/data-context.tsx')
          text = path.read_text(encoding='utf-8')

          pattern = r'const \{data:reportSettingsData=.*?\}\}=useQuery<ReportSettingsData>\(\{queryKey:\["/api/report-settings"\],enabled:isAuthenticated\}\);'
          replacement = '''const DEFAULT_REPORT_SETTINGS_DATA:ReportSettingsData={id:"main",plantPrefix:"PLT",dateFormat:"YYYY-MM-DD",resetRule:"yearly",companyName:"UTEC SAFETY BOARD",companyLogo:"/utec-logo.svg",templateTitle:"Safety Report",publicBaseUrl:null};
          const {data:rawReportSettingsData}=useQuery<ReportSettingsData>({queryKey:["/api/report-settings"],queryFn:async()=>{try{const r=await apiRequest("GET","/api/report-settings");if(!r.ok)return DEFAULT_REPORT_SETTINGS_DATA;const payload=await r.json();return payload&&typeof payload==="object"?payload:DEFAULT_REPORT_SETTINGS_DATA;}catch{return DEFAULT_REPORT_SETTINGS_DATA;}},enabled:isAuthenticated});
          const reportSettingsData:ReportSettingsData=rawReportSettingsData??DEFAULT_REPORT_SETTINGS_DATA;'''

          patched, count = re.subn(pattern, replacement, text, count=1, flags=re.DOTALL)
          if count != 1:
              raise SystemExit('SOR report settings query pattern not found; stopping without changes')
          if patched == text:
              raise SystemExit(0)
          path.write_text(patched, encoding='utf-8')
          print('Patched SOR report settings null handling')
          PY

      - name: Commit and push patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/data-context.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix SOR report settings null handling"
          git push
