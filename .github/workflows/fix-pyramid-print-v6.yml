name: Fix Pyramid Print V6

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic print CSS and DOM
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          page = Path('src/pages/admin/safety-pyramid.tsx')
          text = page.read_text(encoding='utf-8')

          start_marker = '  // Print State'
          end_marker = '  const exportCSV = () => {'
          start = text.find(start_marker)
          end = text.find(end_marker)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('print block markers not found')

          block = r'''  // Deterministic print: no popup and no React timing dependency
  const handlePrint = () => {
    logActivity("Print Safety Pyramid", "Printed visual safety pyramid", "reports");
    window.print();
  };

'''
          text = text[:start] + block + text[end:]

          # Remove an older conditional print sheet and insert a permanent one before main header.
          old_start = text.find('    <div style={{display: isNativePrinting ? "block" : "none"}}')
          if old_start < 0:
              old_start = text.find('    <div className="print-pyramid-sheet"')
          if old_start >= 0:
              # find the closing div immediately followed by Header comment
              header = text.find('      {/* Header */}', old_start)
              if header > 0:
                  text = text[:old_start] + text[header:]

          marker = '      {/* Header */}'
          idx = text.find(marker)
          if idx < 0:
              raise SystemExit('header marker not found')

          sheet = r'''      <div className="pyramid-print-sheet" dir={isAr ? "rtl" : "ltr"}>
        <div className="pyramid-print-page">
          <div className="pyramid-print-header">
            <div>
              <h1>{isAr ? "الهرم الأمني الديناميكي" : "Dynamic Safety Pyramid"}</h1>
              <p>{isAr ? "التقرير المرئي للهرم الأمني" : "Visual Safety Pyramid Report"}</p>
            </div>
            <div className="pyramid-print-meta">HSE-PYRAMID-01<br />{new Date().toLocaleDateString(isAr ? "ar-SA" : "en-US")}</div>
          </div>
          <div className="pyramid-print-kpis">
            <div><strong>{totalIncidents}</strong><span>{isAr ? "إجمالي الحوادث" : "Total Incidents"}</span></div>
            <div><strong>{totalNearMisses}</strong><span>{isAr ? "الوقائع الوشيكة" : "Near Misses"}</span></div>
            <div><strong>{totalObservations}</strong><span>{isAr ? "الأفعال والظروف غير الآمنة" : "Unsafe Acts & Conditions"}</span></div>
          </div>
          <div className="pyramid-print-graphic">
            <svg viewBox={`0 0 900 ${150 + pyramidLevels.filter(l=>l.enabled).length * 84 + 20}`} xmlns="http://www.w3.org/2000/svg" role="img" aria-label={isAr ? "الهرم الأمني" : "Safety Pyramid"}>
              {(() => {
                const levels = pyramidLevels.filter(l=>l.enabled).sort((a,b)=>a.order-b.order);
                const center = 450, topWidth = 120, bottomWidth = 760, segmentHeight = 84, topY = 12;
                const step = levels.length > 1 ? (bottomWidth-topWidth)/(levels.length-1) : 0;
                const colors = ["#991b1b","#dc2626","#f59e0b","#eab308","#f97316","#2563eb","#059669"];
                return levels.map((lvl,index) => {
                  const wTop = topWidth + step*index;
                  const wBottom = index === levels.length-1 ? bottomWidth : topWidth + step*(index+1);
                  const y = topY + index*segmentHeight;
                  const label = isAr ? lvl.nameAr : lvl.nameEn;
                  const count = getLevelCount(lvl.id);
                  return <g key={lvl.id}>
                    <polygon points={`${center-wTop/2},${y} ${center+wTop/2},${y} ${center+wBottom/2},${y+segmentHeight} ${center-wBottom/2},${y+segmentHeight}`} fill={colors[index%colors.length]} stroke="#ffffff" strokeWidth="4" />
                    <text x={center} y={y+34} textAnchor="middle" fontSize={label.length>28?13:16} fontWeight="700" fill="#ffffff">{label}</text>
                    <text x={center} y={y+67} textAnchor="middle" fontSize="25" fontWeight="800" fill="#ffffff">{count}</text>
                  </g>;
                });
              })()}
            </svg>
          </div>
          <div className="pyramid-print-footer"><span>{isAr ? "تم إنشاء التقرير من ABDULKAREM SAFETY BOARD" : "Generated by ABDULKAREM SAFETY BOARD"}</span><span>{isAr ? "الهرم الأمني الديناميكي" : "Dynamic Safety Pyramid"}</span></div>
        </div>
      </div>

'''
          text = text[:idx] + sheet + text[idx:]
          page.write_text(text, encoding='utf-8')
          PY

      - name: Add print CSS
        shell: bash
        run: |
          cat >> src/index.css <<'CSS'

/* Deterministic Safety Pyramid print sheet */
.pyramid-print-sheet { display: none; }

@media print {
  @page { size: A4 portrait; margin: 8mm; }
  html, body { background: #fff !important; }
  body { color: #111827 !important; }
  body > * { background: #fff !important; }
  .pyramid-print-sheet {
    display: block !important;
    position: static !important;
    width: 100% !important;
    min-height: 0 !important;
    visibility: visible !important;
    opacity: 1 !important;
    overflow: visible !important;
    background: #fff !important;
    color: #111827 !important;
    page-break-inside: avoid !important;
  }
  .pyramid-print-page {
    width: 100% !important;
    max-width: 794px !important;
    margin: 0 auto !important;
    background: #fff !important;
    color: #111827 !important;
  }
  .pyramid-print-header {
    display: flex !important;
    justify-content: space-between !important;
    gap: 20px !important;
    align-items: flex-start !important;
    border-bottom: 4px solid #dc2626 !important;
    padding-bottom: 10px !important;
    margin-bottom: 12px !important;
  }
  .pyramid-print-header h1 { margin: 0 !important; font-size: 24px !important; font-weight: 800 !important; color: #111827 !important; }
  .pyramid-print-header p { margin: 4px 0 0 !important; font-size: 12px !important; color: #64748b !important; }
  .pyramid-print-meta { font-size: 10px !important; color: #475569 !important; text-align: right !important; white-space: nowrap !important; }
  .pyramid-print-kpis { display: grid !important; grid-template-columns: repeat(3,1fr) !important; gap: 8px !important; margin-bottom: 12px !important; }
  .pyramid-print-kpis > div { border: 1px solid #cbd5e1 !important; border-radius: 7px !important; padding: 8px !important; text-align: center !important; background: #f8fafc !important; }
  .pyramid-print-kpis strong { display: block !important; font-size: 20px !important; color: #111827 !important; }
  .pyramid-print-kpis span { display: block !important; margin-top: 2px !important; font-size: 9px !important; color: #64748b !important; }
  .pyramid-print-graphic { display: block !important; width: 100% !important; text-align: center !important; }
  .pyramid-print-graphic svg { display: block !important; width: 100% !important; max-width: 760px !important; height: auto !important; margin: 0 auto !important; visibility: visible !important; opacity: 1 !important; }
  .pyramid-print-graphic svg * { visibility: visible !important; opacity: 1 !important; }
  .pyramid-print-footer { display: flex !important; justify-content: space-between !important; gap: 12px !important; margin-top: 8px !important; padding-top: 6px !important; border-top: 1px solid #cbd5e1 !important; color: #64748b !important; font-size: 8px !important; }
  body > div#root > div:not(.pyramid-print-sheet) { display: none !important; }
  .pyramid-print-sheet * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
}
CSS

      - name: Commit print patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/safety-pyramid.tsx src/index.css
          git commit -m "fix: make safety pyramid print reliably from DOM" || exit 0
          git push
