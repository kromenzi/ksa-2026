name: Add Equipment Authorization Preview and Print

on:
  push:
    paths:
      - '.github/workflows/add-equipment-auth-preview-print.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch equipment authorization page
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/admin/equipment-auth.tsx')
          s = p.read_text(encoding='utf-8')

          old_import = '''  Award, \n  Trash2\n} from "lucide-react";'''
          new_import = '''  Award,\n  Trash2,\n  Eye,\n  Printer\n} from "lucide-react";'''
          if old_import in s and '  Eye,' not in s:
              s = s.replace(old_import, new_import, 1)

          state_marker = '''  const [isAddOpen, setIsAddOpen] = useState(false);\n  const [isViewQRModal, setIsViewQRModal] = useState(false);\n  const [activeAuth, setActiveAuth] = useState<EquipmentAuth | null>(null);'''
          state_repl = '''  const [isAddOpen, setIsAddOpen] = useState(false);\n  const [isViewQRModal, setIsViewQRModal] = useState(false);\n  const [isPreviewOpen, setIsPreviewOpen] = useState(false);\n  const [activeAuth, setActiveAuth] = useState<EquipmentAuth | null>(null);'''
          if state_marker in s:
              s = s.replace(state_marker, state_repl, 1)

          funcs_marker = '''  const deleteAuth = (id: string) => {\n    setAuthorizations(authorizations.filter(a => a.id !== id));\n    toast.success(isAr ? "تم الحذف بنجاح" : "Authorization deleted successfully");\n  };'''
          funcs_repl = funcs_marker + '''\n\n  const handlePreview = (item: EquipmentAuth) => {\n    setActiveAuth(item);\n    setIsPreviewOpen(true);\n  };\n\n  const handlePrint = (item: EquipmentAuth) => {\n    const dir = isAr ? "rtl" : "ltr";\n    const align = isAr ? "right" : "left";\n    const title = isAr ? "تصريح / تفويض تشغيل معدة" : "OFFICIAL EQUIPMENT AUTHORIZATION";\n    const statusLabel = item.status === "VALID" ? (isAr ? "ساري" : "VALID") : item.status === "EXPIRING_SOON" ? (isAr ? "قريب الانتهاء" : "EXPIRING SOON") : item.status === "EXPIRED" ? (isAr ? "منتهي" : "EXPIRED") : (isAr ? "موقوف" : "SUSPENDED");\n    const qrText = encodeURIComponent(`SAFETY-BOARD-AUTH:${item.id}:${item.employeeId}:${item.certificateNo}`);\n    const row = (label: string, value: string) => `<div class="field"><div class="label">${label}</div><div class="value">${value || "—"}</div></div>`;\n    const html = `<!doctype html><html lang="${isAr ? "ar" : "en"}" dir="${dir}"><head><meta charset="utf-8"><title>${item.certificateNo}</title><style>\n      *{box-sizing:border-box}body{margin:0;background:#eef2f7;color:#0f172a;font-family:Arial,"Segoe UI",Tahoma,sans-serif;padding:18px}\n      .sheet{width:794px;min-height:1123px;margin:0 auto;background:#fff;border:1.5px solid #334155;border-radius:14px;overflow:hidden;box-shadow:0 8px 24px rgba(15,23,42,.08)}\n      .top{padding:22px 26px;border-bottom:3px solid #0f766e;display:flex;justify-content:space-between;gap:24px;align-items:flex-start} .brand{font-size:23px;font-weight:800;letter-spacing:.4px}.sub{font-size:11px;color:#64748b;margin-top:5px}.official{font-size:11px;font-weight:800;color:#0f766e;letter-spacing:1px;text-transform:uppercase}\n      .title{padding:20px 26px;text-align:${align};background:linear-gradient(180deg,#ecfdf5,#fff)}.title h1{margin:0;font-size:24px;letter-spacing:.2px}.title p{margin:7px 0 0;color:#475569;font-size:12px}\n      .grid{padding:18px 26px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{border:1px solid #dbe3ea;border-radius:9px;padding:11px 13px;background:#f8fafc;min-height:68px;text-align:${align}}.label{font-size:10px;font-weight:800;color:#64748b;margin-bottom:5px;text-transform:uppercase}.value{font-size:14px;font-weight:700;line-height:1.5;word-break:break-word}\n      .wide{grid-column:1/-1}.status{display:inline-block;padding:7px 12px;border-radius:999px;background:${item.status === "VALID" ? "#ecfdf5" : item.status === "EXPIRED" ? "#fef2f2" : "#fffbeb"};color:${item.status === "VALID" ? "#047857" : item.status === "EXPIRED" ? "#b91c1c" : "#b45309"};font-weight:800;font-size:11px}.qrbox{display:flex;align-items:center;justify-content:space-between;gap:18px;margin:10px 26px 0;padding:16px;border:1px solid #dbe3ea;border-radius:12px;background:#fff}.qrbox img{width:118px;height:118px}.notes{padding:0 26px 18px}.notes .field{min-height:92px}.sign{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:18px 26px 28px}.sig{border-top:1px solid #94a3b8;padding-top:8px;text-align:${align};font-size:11px;color:#475569}.foot{padding:11px 26px;background:#f8fafc;border-top:1px solid #e2e8f0;font-size:10px;color:#64748b;display:flex;justify-content:space-between;gap:12px;flex-direction:${isAr ? "row-reverse" : "row"}}\n      @page{size:A4;margin:10mm}@media print{body{background:#fff;padding:0}.sheet{width:auto;min-height:auto;border:1px solid #334155;box-shadow:none}.no-print{display:none}}\n    </style></head><body><div class="sheet">\n      <div class="top"><div><div class="brand">ABDULKAREM SAFETY BOARD</div><div class="sub">${isAr ? "إدارة الصحة والسلامة والامتثال" : "Health, Safety & Compliance Management"}</div></div><div class="official">${isAr ? "مستند رسمي" : "Official Document"}</div></div>\n      <div class="title"><h1>${title}</h1><p>${item.category} • ${item.equipmentModel || (isAr ? "معدة تشغيل" : "Equipment")}</p></div>\n      <div class="grid">\n        ${row(isAr ? "رقم التفويض" : "Authorization No.", item.id)}\n        ${row(isAr ? "رقم الشهادة / الرخصة" : "Certificate / License No.", item.certificateNo)}\n        ${row(isAr ? "اسم الموظف" : "Employee Name", item.employeeName)}\n        ${row(isAr ? "الرقم الوظيفي" : "Employee ID", item.employeeId)}\n        ${row(isAr ? "القسم" : "Department", item.department)}\n        ${row(isAr ? "فئة التفويض" : "Authorization Category", item.category)}\n        ${row(isAr ? "مرجع التدريب" : "Training Reference", item.trainingRef)}\n        ${row(isAr ? "الفاحص / المقيم" : "Assessor", item.assessorName)}\n        ${row(isAr ? "تاريخ الإصدار" : "Issue Date", item.issueDate)}\n        ${row(isAr ? "تاريخ الانتهاء" : "Expiry Date", item.expiryDate)}\n        <div class="field wide"><div class="label">${isAr ? "الحالة" : "Status"}</div><div class="value"><span class="status">${statusLabel}</span></div></div>\n      </div>\n      <div class="qrbox"><div><div class="label">${isAr ? "رمز التحقق" : "Verification"}</div><div class="value" style="font-size:12px">${isAr ? "امسح رمز QR للتحقق من بيانات التفويض." : "Scan the QR code to verify the authorization record."}</div></div><img src="https://quickchart.io/qr?text=${qrText}&size=180" alt="QR"></div>\n      <div class="notes"><div class="field wide"><div class="label">${isAr ? "ملاحظات / شروط التشغيل" : "Notes / Operating Conditions"}</div><div class="value">${(item.notes || (isAr ? "لا توجد ملاحظات إضافية." : "No additional notes.")).replace(/</g,"&lt;").replace(/>/g,"&gt;")}</div></div></div>\n      <div class="sign"><div class="sig">${isAr ? "توقيع المسؤول المعتمد" : "Authorized HSE Manager Signature"}<br><br>____________________________</div><div class="sig">${isAr ? "توقيع الفاحص / المقيم" : "Assessor / Evaluator Signature"}<br><br>____________________________</div></div>\n      <div class="foot"><span>${isAr ? "وثيقة رسمية قابلة للتحقق" : "Official verifiable authorization document"}</span><span>${new Date().toLocaleString(isAr ? "ar-SA" : "en-US")}</span></div>\n      </div></body></html>`;\n    const w = window.open("", "_blank", "width=900,height=1200");\n    if (!w) { toast.error(isAr ? "يرجى السماح بالنوافذ المنبثقة للطباعة" : "Please allow popups to print"); return; }\n    w.document.open(); w.document.write(html); w.document.close();\n    setTimeout(() => { w.focus(); w.print(); }, 700);\n  };'''
          if 'const handlePreview = (item: EquipmentAuth)' not in s:
              if funcs_marker not in s:
                  raise SystemExit('deleteAuth marker not found')
              s = s.replace(funcs_marker, funcs_repl, 1)

          old_actions = '''                        <Button\n                          variant="ghost"\n                          size="icon"\n                          className="h-8 w-8 rounded-xl text-blue-500 hover:bg-blue-500/10"\n                          title={isAr ? "عرض رمز الاستجابة السريعة (QR)" : "View QR Verification"}\n                          onClick={() => { setActiveAuth(item); setIsViewQRModal(true); }}\n                        >\n                          <QrCode className="h-4 w-4" />\n                        </Button>'''
          new_actions = '''                        <Button\n                          variant="ghost"\n                          size="icon"\n                          className="h-8 w-8 rounded-xl text-indigo-500 hover:bg-indigo-500/10"\n                          title={isAr ? "معاينة التفويض" : "Preview Authorization"}\n                          onClick={() => handlePreview(item)}\n                        >\n                          <Eye className="h-4 w-4" />\n                        </Button>\n                        <Button\n                          variant="ghost"\n                          size="icon"\n                          className="h-8 w-8 rounded-xl text-emerald-600 hover:bg-emerald-500/10"\n                          title={isAr ? "طباعة التفويض" : "Print Authorization"}\n                          onClick={() => handlePrint(item)}\n                        >\n                          <Printer className="h-4 w-4" />\n                        </Button>\n                        <Button\n                          variant="ghost"\n                          size="icon"\n                          className="h-8 w-8 rounded-xl text-blue-500 hover:bg-blue-500/10"\n                          title={isAr ? "عرض رمز الاستجابة السريعة (QR)" : "View QR Verification"}\n                          onClick={() => { setActiveAuth(item); setIsViewQRModal(true); }}\n                        >\n                          <QrCode className="h-4 w-4" />\n                        </Button>'''
          if old_actions in s:
              s = s.replace(old_actions, new_actions, 1)

          preview_before_qr = '''      <Dialog open={isViewQRModal} onOpenChange={setIsViewQRModal}>'''
          preview_dialog = '''      <Dialog open={isPreviewOpen} onOpenChange={setIsPreviewOpen}>\n        <DialogContent className="sm:max-w-2xl rounded-3xl p-0 overflow-hidden">\n          <DialogHeader className="px-6 pt-6">\n            <DialogTitle>{isAr ? "معاينة التفويض الرسمي" : "Official Authorization Preview"}</DialogTitle>\n            <DialogDescription>{isAr ? "معاينة مستند الطباعة قبل اعتماده." : "Preview the official document before printing."}</DialogDescription>\n          </DialogHeader>\n          {activeAuth && (\n            <div className="px-6 pb-6">\n              <div className="rounded-2xl border-2 border-slate-700 bg-white text-slate-900 overflow-hidden shadow-sm" dir={isAr ? "rtl" : "ltr"}>\n                <div className="border-b-4 border-emerald-600 px-5 py-4 flex items-start justify-between gap-4">\n                  <div><div className="font-extrabold text-xl">ABDULKAREM SAFETY BOARD</div><div className="text-xs text-slate-500 mt-1">{isAr ? "إدارة الصحة والسلامة والامتثال" : "Health, Safety & Compliance Management"}</div></div>\n                  <Badge variant="outline" className="font-bold">{activeAuth.status}</Badge>\n                </div>\n                <div className="px-5 py-4 bg-emerald-50/70"><div className="text-xl font-extrabold">{isAr ? "تصريح / تفويض تشغيل معدة" : "OFFICIAL EQUIPMENT AUTHORIZATION"}</div><div className="text-xs text-slate-500 mt-1">{activeAuth.category} • {activeAuth.equipmentModel || "Equipment"}</div></div>\n                <div className="grid grid-cols-2 gap-3 p-5">\n                  {[\n                    [isAr ? "رقم التفويض" : "Authorization No.", activeAuth.id],\n                    [isAr ? "رقم الشهادة" : "Certificate No.", activeAuth.certificateNo],\n                    [isAr ? "اسم الموظف" : "Employee Name", activeAuth.employeeName],\n                    [isAr ? "الرقم الوظيفي" : "Employee ID", activeAuth.employeeId],\n                    [isAr ? "القسم" : "Department", activeAuth.department],\n                    [isAr ? "الفئة" : "Category", activeAuth.category],\n                    [isAr ? "مرجع التدريب" : "Training Reference", activeAuth.trainingRef],\n                    [isAr ? "الفاحص" : "Assessor", activeAuth.assessorName],\n                    [isAr ? "الإصدار" : "Issue Date", activeAuth.issueDate],\n                    [isAr ? "الانتهاء" : "Expiry Date", activeAuth.expiryDate],\n                  ].map(([label, value]) => <div key={label} className="rounded-xl border bg-slate-50 p-3"><div className="text-[10px] font-bold text-slate-500 uppercase">{label}</div><div className="text-sm font-bold mt-1 break-words">{value || "—"}</div></div>)}\n                </div>\n                <div className="mx-5 mb-5 rounded-xl border p-4 flex items-center justify-between gap-4">\n                  <div><div className="text-[10px] font-bold text-slate-500 uppercase">{isAr ? "ملاحظات" : "Notes"}</div><div className="text-sm mt-1">{activeAuth.notes || (isAr ? "لا توجد ملاحظات" : "No additional notes")}</div></div>\n                  <QRCodeSVG value={`SAFETY-BOARD-AUTH:${activeAuth.id}:${activeAuth.employeeId}:${activeAuth.certificateNo}`} size={104} level="H" includeMargin />\n                </div>\n                <div className="grid grid-cols-2 gap-6 px-5 pb-5 text-xs text-slate-500"><div className="border-t pt-2">{isAr ? "توقيع المسؤول المعتمد" : "Authorized HSE Manager"}<br/><br/>________________________</div><div className="border-t pt-2">{isAr ? "توقيع الفاحص / المقيم" : "Assessor / Evaluator"}<br/><br/>________________________</div></div>\n              </div>\n              <div className="flex justify-end gap-2 mt-4"><Button variant="outline" onClick={() => setIsPreviewOpen(false)}>{isAr ? "إغلاق" : "Close"}</Button><Button onClick={() => handlePrint(activeAuth)} className="gap-2"><Printer className="h-4 w-4" />{isAr ? "طباعة" : "Print"}</Button></div>\n            </div>\n          )}\n        </DialogContent>\n      </Dialog>\n\n      <Dialog open={isViewQRModal} onOpenChange={setIsViewQRModal}>'''
          if preview_before_qr in s and 'Official Authorization Preview' not in s:
              s = s.replace(preview_before_qr, preview_dialog, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify build
        run: |
          grep -n 'handlePreview\|handlePrint\|Official Authorization Preview\|Print Authorization' src/pages/admin/equipment-auth.tsx
          npm ci
          npm run build

      - name: Commit and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/admin/equipment-auth.tsx
          git commit -m 'feat: add equipment authorization preview and print' || true
          git push
          git rm .github/workflows/add-equipment-auth-preview-print.yml
          git commit -m 'chore: remove temporary equipment auth workflow' || true
          git push
