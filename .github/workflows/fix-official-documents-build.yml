name: Fix Official Document Build

on:
  push:
    paths:
      - '.github/workflows/fix-official-documents-build.yml'

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch preview scope
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/print-share-dialog.tsx')
          s = p.read_text(encoding='utf-8')
          marker = '  const isNcr = item.type === "ncr";\n  const showQr = item.type === "ncr" || item.type === "report";\n'
          replacement = marker + '  const isOfficialLicense = Boolean(item.refNo && (item.refNo.startsWith("LIC-") || item.refNo.includes("HSE-LIC")));\n  const isTrainingCertificate = Boolean(item.refNo && item.refNo.startsWith("CERT-"));\n'
          if 'function PrintView' in s and s.count(marker) < 2:
              raise SystemExit('unexpected marker count; preview scope patch requires PrintView marker present')
          # Only add to the second occurrence (PrintView), since the first is already inside buildPrintHtml.
          first = s.find(marker)
          second = s.find(marker, first + len(marker))
          if second == -1:
              raise SystemExit('second marker not found')
          s = s[:second] + replacement + s[second + len(marker):]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify build
        run: |
          grep -n 'isOfficialLicense\|CERTIFICATE OF TRAINING\|OFFICIAL LICENSE / PERMIT' src/components/print-share-dialog.tsx src/pages/admin/licenses.tsx src/pages/admin/trainings.tsx
          npm ci
          npm run build
      - name: Commit and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/print-share-dialog.tsx src/pages/admin/licenses.tsx src/pages/admin/trainings.tsx
          git commit -m 'fix: complete official license and training certificate templates' || true
          git push
          git rm .github/workflows/rework-official-documents.yml .github/workflows/fix-official-documents-build.yml
          git commit -m 'chore: remove temporary official document workflows' || true
          git push
