name: Apply HSE photo attachments

on:
  push:
    branches:
      - feat/ncr-violation-four-photos
    paths:
      - scripts/apply-hse-photo-attachments.py
      - .github/workflows/apply-hse-photo-attachments.yml

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/ncr-violation-four-photos
          fetch-depth: 0
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply HSE photo patch
        run: python scripts/apply-hse-photo-attachments.py
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Commit generated production changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/system-health.ts src/pages/admin/employee-violations.tsx src/pages/admin/ncr/new-fixed.tsx src/pages/admin/ncr/form.tsx src/components/print-share-dialog.tsx
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "feat: add four-photo evidence to violations and NCR"
            git push origin HEAD:feat/ncr-violation-four-photos
          fi
