name: Integrate Employee Safety Violations
on:
  push:
    branches: [main]
    paths:
      - "scripts/add-employee-safety-violations.py"
      - ".github/workflows/add-employee-safety-violations.yml"
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply integration patch
        run: python3 scripts/add-employee-safety-violations.py
      - name: Install dependencies
        run: npm ci
      - name: TypeScript and Vite build
        run: npm run build
      - name: Commit navigation integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/layouts/admin-layout.tsx
          if git diff --cached --quiet; then
            echo "No integration changes required"
            exit 0
          fi
          git commit -m "feat: expose employee safety violations module"
          git push
