name: Fix equipment authorization UI

on:
  push:
    paths:
      - '.github/workflows/fix-equipment-auth-ui.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch equipment authorization page and sidebar
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          eq = Path('src/pages/admin/equipment-auth.tsx')
          s = eq.read_text(encoding='utf-8')

          # Icons
          s = s.replace('  Trash2\n} from "lucide-react";', '  Trash2,\n  Eye,\n  Printer,\n  Send,\n  Mail,\n} from "lucide-react";')

          # State for preview/send
          marker = '  const [activeAuth, setActiveAuth] = useState<EquipmentAuth | null>(null);\n'
          insert = marker + '''  const [isPreviewOpen, setIsPreviewOpen] = useState(false);\n  const [isSendOpen, setIsSendOpen] = useState(false);\n  const [sendEmail, setSendEmail] = useState(\"\");\n'''
          if marker in s and 'const [isPreviewOpen' not in s:
              s = s.replace(marker, insert)

          # Helpers before filtered list
          marker = '  const filtered = authorizations.filter(item => {\n'
          helpers = '''  const handlePrintAuth = (auth: EquipmentAuth) => {\n    const popup = window.open(\"\", \"_blank\", \"width=1100,height=850\");\n    if (!popup) {\n      toast.error(isAr ? \"اسمح بالنوافذ المنبثقة للطباعة\" : \"Allow pop-ups to print the authorization\");\n      return;\n    }\n    const qr = `SAFETY-BOARD-AUTH:${auth.id}:${auth.employeeId}:${auth.certificateNo}`;\n    popup.document.write(`<!doctype html><html dir=\"${isAr ? 'rtl' : 'ltr'}\"><head><meta charset=\"utf-8\"><title>${auth.certificateNo}</title><style>@page{size:A4 landscape;margin:10mm}body{font-family:Arial,Tahoma,sans-serif;margin:0;color:#0f172a;background:#fff}.sheet{border:4px solid #0f766e;border-radius:18px;padding:34px;min-height:185mm;box-sizing:border-box}.head{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #d1d5db;padding-bottom:18px}.brand{font-size:26px;font-weight:800;color:#0f766e}.title{font-size:28px;font-weight:800;margin:24px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.cell{border:1px solid #cbd5e1;border-radius:10px;padding:12px}.label{font-size:11px;color:#64748b;margin-bottom:4px}.value{font-size:15px;font-weight:700}.footer{margin-top:28px;display:flex;justify-content:space-between;align-items:end}.sig{width:30%;border-top:1px solid #64748b;text-align:center;padding-top:7px;font-size:12px}.qr{width:105px;height:105px;border:1px solid #d1d5db;padding:8px;object-fit:contain}.status{display:inline-block;padding:5px 10px;border-radius:999px;border:1px solid #10b981;color:#047857;background:#ecfdf5;font-weight:700}</style></head><body><div class=\"sheet\"><div class=\"head\"><div><div class=\"brand\">ABDULKAREM SAFETY BOARD</div><div style=\"color:#64748b\">Official Equipment Authorization</div></div><img class=\"qr\" src=\"https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(qr)}\"></div><div class=\"title\">${isAr ? 'تفويض رسمي لتشغيل المعدة' : 'OFFICIAL EQUIPMENT AUTHORIZATION'}</div><div class=\"grid\"><div class=\"cell\"><div class=\"label\">${isAr ? 'اسم الموظف' : 'Employee Name'}</div><div class=\"value\">${auth.employeeName}</div></div><div class=\"cell\"><div class=\"label\">${isAr ? 'الرقم الوظيفي' : 'Employee ID'}</div><div class=\"value\">${auth.employeeId}</div></div><div class=\"cell\"><div class=\"label\">${isAr ? 'القسم' : 'Department'}</div><div class=\"value\">${auth.department}</div></div><div class=\"cell\"><div class=\"label\">${isAr ? 'نوع التفويض' : 'Authorization Category'}</div><div class=\"value\">${auth.category}</div></div><div class=\"cell\"><div class=\"label\">${isAr ? 'المعدة' : 'Equipment'}</div><div class=\"value\">${auth.equipmentModel || '—'}</div></div><div class=\"cell\"><div class=\"label\">${isAr ? 'رقم الشهادة' : 'Certificate No.'}</div><div class=\"value\">${auth.certificateNo}</div></div><div class=\"cell\"><div class=\"label\">${isAr ? 'تاريخ الإصدار' : 'Issue Date'}</div><div class=\"value\">${auth.issueDate}</div></div><div class=\"cell\"><div class=\"label\">${isAr ? 'تاريخ الانتهاء' : 'Expiry Date'}</div><div class=\"value\">${auth.expiryDate}</div></div><div class=\"cell\"><div class=\"label\">${isAr ? 'الحالة' : 'Status'}</div><div class=\"value\"><span class=\"status\">${auth.status}</span></div></div></div><div style=\"margin-top:18px;color:#334155\"><b>${isAr ? 'مرجع التدريب:' : 'Training Reference:'}</b> ${auth.trainingRef || '—'} &nbsp;&nbsp; <b>${isAr ? 'المقيم:' : 'Assessor:'}</b> ${auth.assessorName || '—'}</div><div style=\"margin-top:14px;color:#475569\">${auth.notes || ''}</div><div class=\"footer\"><div class=\"sig\">HSE Manager / مدير السلامة</div><div class=\"sig\">Assessor / المقيم</div><div class=\"sig\">Employee / الموظف</div></div></div><script>setTimeout(()=>{window.focus();window.print()},350)</script></body></html>`);\n    popup.document.close();\n  };\n\n  const handleSendAuth = () => {\n    if (!activeAuth) return;\n    const recipient = sendEmail.trim();\n    if (!recipient) {\n      toast.error(isAr ? \"أدخل البريد الإلكتروني\" : \"Enter an email address\");\n      return;\n    }\n    const subject = `${isAr ? 'تفويض معدات' : 'Equipment Authorization'} - ${activeAuth.certificateNo}`;\n    const body = `${isAr ? 'تفويض تشغيل معدات رسمي' : 'Official Equipment Authorization'}\\n\\nEmployee: ${activeAuth.employeeName}\\nEmployee ID: ${activeAuth.employeeId}\\nCategory: ${activeAuth.category}\\nEquipment: ${activeAuth.equipmentModel || '—'}\\nCertificate: ${activeAuth.certificateNo}\\nIssue: ${activeAuth.issueDate}\\nExpiry: ${activeAuth.expiryDate}\\nStatus: ${activeAuth.status}\\nTraining Ref: ${activeAuth.trainingRef || '—'}\\nAssessor: ${activeAuth.assessorName || '—'}`;\n    window.location.href = `mailto:${encodeURIComponent(recipient)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;\n    setIsSendOpen(false);\n  };\n\n'''
          if marker in s and 'const handlePrintAuth' not in s:
              s = s.replace(marker, helpers + marker)

          # Replace action cell
          old = '''                    <td className=\"py-4 px-5 text-end\">\n                      <div className=\"flex items-center justify-end gap-1.5\">\n                        <Button\n                          variant=\"ghost\"\n                          size=\"icon\"\n                          className=\"h-8 w-8 rounded-xl text-blue-500 hover:bg-blue-500/10\"\n                          title={isAr ? \"عرض رمز الاستجابة السريعة (QR)\" : \"View QR Verification\"}\n                          onClick={() => { setActiveAuth(item); setIsViewQRModal(true); }}\n                        >\n                          <QrCode className=\"h-4 w-4\" />\n                        </Button>\n                        <Button\n                          variant=\"ghost\"\n                          size=\"icon\"\n                          className=\"h-8 w-8 rounded-xl text-destructive hover:bg-destructive/10\"\n                          title={isAr ? \"حذف\" : \"Delete\"}\n                          onClick={() => deleteAuth(item.id)}\n                        >\n                          <Trash2 className=\"h-4 w-4\" />\n                        </Button>\n                      </div>\n                    </td>'''
          new = '''                    <td className=\"py-4 px-5 text-end\">\n                      <div className=\"flex items-center justify-end gap-1.5 flex-wrap\">\n                        <Button variant=\"ghost\" size=\"icon\" className=\"h-8 w-8 rounded-xl text-blue-500 hover:bg-blue-500/10\" title={isAr ? \"معاينة\" : \"Preview\"} onClick={() => { setActiveAuth(item); setIsPreviewOpen(true); }}>\n                          <Eye className=\"h-4 w-4\" />\n                        </Button>\n                        <Button variant=\"ghost\" size=\"icon\" className=\"h-8 w-8 rounded-xl text-violet-500 hover:bg-violet-500/10\" title={isAr ? \"طباعة\" : \"Print\"} onClick={() => handlePrintAuth(item)}>\n                          <Printer className=\"h-4 w-4\" />\n                        </Button>\n                        <Button variant=\"ghost\" size=\"icon\" className=\"h-8 w-8 rounded-xl text-emerald-500 hover:bg-emerald-500/10\" title={isAr ? \"إرسال\" : \"Send\"} onClick={() => { setActiveAuth(item); setIsSendOpen(true); }}>\n                          <Send className=\"h-4 w-4\" />\n                        </Button>\n                        <Button variant=\"ghost\" size=\"icon\" className=\"h-8 w-8 rounded-xl text-cyan-500 hover:bg-cyan-500/10\" title={isAr ? \"عرض QR\" : \"View QR\"} onClick={() => { setActiveAuth(item); setIsViewQRModal(true); }}>\n                          <QrCode className=\"h-4 w-4\" />\n                        </Button>\n                        <Button variant=\"ghost\" size=\"icon\" className=\"h-8 w-8 rounded-xl text-red-500 hover:bg-red-500/10\" title={isAr ? \"حذف\" : \"Delete\"} onClick={() => deleteAuth(item.id)}>\n                          <Trash2 className=\"h-4 w-4\" />\n                        </Button>\n                      </div>\n                    </td>'''
          if old not in s:
              raise SystemExit('Expected equipment action cell not found')
          s = s.replace(old, new, 1)

          # Insert preview + send dialogs before QR dialog
          marker = '      <Dialog open={isViewQRModal} onOpenChange={setIsViewQRModal}>\n'
          dialogs = '''      <Dialog open={isPreviewOpen} onOpenChange={setIsPreviewOpen}>\n        <DialogContent className=\"max-w-3xl rounded-3xl p-0 overflow-hidden\">\n          <DialogHeader className=\"px-6 pt-6\"><DialogTitle>{isAr ? 'معاينة تفويض المعدات' : 'Equipment Authorization Preview'}</DialogTitle><DialogDescription>{isAr ? 'معاينة المستند الرسمي قبل الطباعة.' : 'Preview the official authorization before printing.'}</DialogDescription></DialogHeader>\n          {activeAuth && <div className=\"mx-6 mb-6 border-4 border-emerald-700 rounded-3xl bg-white text-slate-900 p-7 shadow-xl\" dir={isAr ? 'rtl' : 'ltr'}>\n            <div className=\"flex items-start justify-between gap-4 border-b pb-5\"><div><div className=\"text-2xl font-extrabold text-emerald-700\">ABDULKAREM SAFETY BOARD</div><div className=\"text-sm text-slate-500\">{isAr ? 'تفويض رسمي لتشغيل المعدة' : 'OFFICIAL EQUIPMENT AUTHORIZATION'}</div></div><div className=\"rounded-xl border px-3 py-2 text-xs font-bold\">{activeAuth.certificateNo}</div></div>\n            <div className=\"grid grid-cols-1 md:grid-cols-3 gap-3 mt-5\">{[[isAr?'اسم الموظف':'Employee Name',activeAuth.employeeName],[isAr?'الرقم الوظيفي':'Employee ID',activeAuth.employeeId],[isAr?'القسم':'Department',activeAuth.department],[isAr?'نوع التفويض':'Authorization Category',activeAuth.category],[isAr?'المعدة':'Equipment',activeAuth.equipmentModel||'—'],[isAr?'تاريخ الإصدار':'Issue Date',activeAuth.issueDate],[isAr?'تاريخ الانتهاء':'Expiry Date',activeAuth.expiryDate],[isAr?'الحالة':'Status',activeAuth.status],[isAr?'مرجع التدريب':'Training Reference',activeAuth.trainingRef||'—']].map(([label,value]) => <div key={String(label)} className=\"border rounded-xl p-3\"><div className=\"text-xs text-slate-500\">{label}</div><div className=\"font-bold mt-1\">{value}</div></div>)}</div>\n            <div className=\"mt-6 grid grid-cols-3 gap-6 text-center text-xs text-slate-600\"><div className=\"border-t pt-2\">HSE Manager</div><div className=\"border-t pt-2\">Assessor</div><div className=\"border-t pt-2\">Employee</div></div>\n          </div>}\n          <DialogFooter className=\"px-6 pb-6\"><Button variant=\"outline\" onClick={() => setIsPreviewOpen(false)}>{isAr ? 'إغلاق' : 'Close'}</Button>{activeAuth && <Button onClick={() => handlePrintAuth(activeAuth)} className=\"gap-2\"><Printer className=\"h-4 w-4\" />{isAr ? 'طباعة' : 'Print'}</Button>}</DialogFooter>\n        </DialogContent>\n      </Dialog>\n\n      <Dialog open={isSendOpen} onOpenChange={setIsSendOpen}>\n        <DialogContent className=\"sm:max-w-md rounded-3xl p-6\">\n          <DialogHeader><DialogTitle>{isAr ? 'إرسال تفويض المعدات' : 'Send Equipment Authorization'}</DialogTitle><DialogDescription>{isAr ? 'سيتم فتح تطبيق البريد لإرسال بيانات التفويض.' : 'This opens your email client with the authorization details prepared.'}</DialogDescription></DialogHeader>\n          {activeAuth && <div className=\"space-y-4\"><div className=\"rounded-2xl border p-4 bg-muted/30\"><div className=\"font-bold\">{activeAuth.employeeName}</div><div className=\"text-sm text-muted-foreground\">{activeAuth.certificateNo} • {activeAuth.category}</div></div><div className=\"space-y-2\"><Label>{isAr ? 'البريد الإلكتروني' : 'Email Address'}</Label><div className=\"relative\"><Mail className=\"absolute start-3 top-1/2 -translate-y-1/2 h-4 w-4 text-muted-foreground\" /><Input className=\"ps-9 rounded-2xl\" type=\"email\" value={sendEmail} onChange={e => setSendEmail(e.target.value)} placeholder=\"name@example.com\" /></div></div></div>}\n          <DialogFooter><Button variant=\"outline\" onClick={() => setIsSendOpen(false)}>{isAr ? 'إلغاء' : 'Cancel'}</Button><Button onClick={handleSendAuth} className=\"gap-2 bg-emerald-600 hover:bg-emerald-700 text-white\"><Send className=\"h-4 w-4\" />{isAr ? 'إرسال' : 'Send'}</Button></DialogFooter>\n        </DialogContent>\n      </Dialog>\n\n'''
          if marker not in s:
              raise SystemExit('QR dialog marker not found')
          s = s.replace(marker, dialogs + marker, 1)
          eq.write_text(s, encoding='utf-8')

          # Split Equipment Authorization into its own actual collapsible nav group.
          side = Path('src/components/layouts/admin-layout.tsx')
          t = side.read_text(encoding='utf-8')
          start = t.index('    {\n      title: "Licenses & Equipment Authorization",')
          end = t.index('    {\n      title: "Assets & Emergency",', start)
          replacement = '''    {\n      title: "Licenses & Training",\n      titleAr: "التراخيص والتدريب",\n      items: [\n        { label: isAr ? 'لوحة القيادة' : 'Dashboard', icon: LayoutDashboard, href: "/admin/licenses", visible: true, color: "text-blue-500", bgColor: "bg-blue-500/10" },\n        { label: isAr ? 'التراخيص' : 'Licenses', icon: CreditCard, href: "/admin/licenses", visible: true, color: "text-amber-500", bgColor: "bg-amber-500/10" },\n        { label: isAr ? 'التدريب والكفاءة' : 'Training & Competency', icon: GraduationCap, href: "/admin/trainings", visible: true, color: "text-indigo-500", bgColor: "bg-indigo-500/10" },\n        { label: isAr ? 'العناصر منتهية الصلاحية' : 'Expiring Items', icon: Clock, href: "/admin/licenses", visible: true, color: "text-amber-500", bgColor: "bg-amber-500/10" },\n        { label: isAr ? 'مصفوفة الكفاءة' : 'Competency Matrix', icon: Grid, href: "/admin/training-matrix", visible: true, color: "text-teal-500", bgColor: "bg-teal-500/10" },\n        { label: isAr ? 'تقارير التفويض' : 'Authorization Reports', icon: ScrollText, href: "/admin/enterprise-reports", visible: true, color: "text-slate-400", bgColor: "bg-slate-500/10" },\n      ]\n    },\n    {\n      title: "Equipment Authorization",\n      titleAr: "تفويض المعدات",\n      items: [\n        { label: isAr ? 'لوحة تفويض المعدات' : 'Equipment Authorization Dashboard', icon: ShieldCheck, href: "/admin/equipment-auth", visible: true, color: "text-emerald-500", bgColor: "bg-emerald-500/10" },\n        { label: isAr ? 'رافعة شوكية (Forklift)' : 'Forklift', icon: Truck, href: "/admin/equipment-auth", visible: true, color: "text-blue-600", bgColor: "bg-blue-600/10" },\n        { label: isAr ? 'ونش علوي (Overhead Crane)' : 'Overhead Crane', icon: Wrench, href: "/admin/equipment-auth", visible: true, color: "text-orange-500", bgColor: "bg-orange-500/10" },\n        { label: isAr ? 'رافعات الأفراد (Lifter / Manlift)' : 'Lifter / Manlift', icon: Activity, href: "/admin/equipment-auth", visible: true, color: "text-purple-500", bgColor: "bg-purple-500/10" },\n        { label: isAr ? 'منصات العمل المتحركة (MEWP)' : 'MEWP', icon: Truck, href: "/admin/equipment-auth", visible: true, color: "text-cyan-500", bgColor: "bg-cyan-500/10" },\n        { label: isAr ? 'الربط والإشارات (Rigging & Banksman)' : 'Rigging & Banksman', icon: Award, href: "/admin/equipment-auth", visible: true, color: "text-amber-600", bgColor: "bg-amber-600/10" },\n        { label: isAr ? 'التفويض الكهربائي (Electrical)' : 'Electrical Authorization', icon: Zap, href: "/admin/equipment-auth", visible: true, color: "text-yellow-500", bgColor: "bg-yellow-500/10" },\n        { label: isAr ? 'عزل الطاقة (LOTO)' : 'LOTO Authorization', icon: Lock, href: "/admin/equipment-auth", visible: true, color: "text-rose-600", bgColor: "bg-rose-600/10" },\n        { label: isAr ? 'العمل على ارتفاعات' : 'Work at Height', icon: ShieldAlert, href: "/admin/equipment-auth", visible: true, color: "text-sky-600", bgColor: "bg-sky-600/10" },\n        { label: isAr ? 'الأماكن المغلقة' : 'Confined Space', icon: AlertTriangle, href: "/admin/equipment-auth", visible: true, color: "text-red-500", bgColor: "bg-red-500/10" },\n      ]\n    },\n'''
          t = t[:start] + replacement + t[end:]
          side.write_text(t, encoding='utf-8')

          # Verify
          for needle in [\n              'const handlePrintAuth',\n              'const handleSendAuth',\n              'isPreviewOpen',\n              'title: "Equipment Authorization"',\n              'titleAr: "تفويض المعدات"',\n              '<Eye className="h-4 w-4" />',\n              '<Printer className="h-4 w-4" />',\n              '<Send className="h-4 w-4" />',\n          ]:\n              path = eq if 'Auth' in needle or needle.startswith('<') else side\n              if needle not in path.read_text(encoding='utf-8'):\n                  raise SystemExit(f'Missing patch marker: {needle}')\n          print('Equipment authorization UI patch verified')\n          PY

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Commit patch and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/admin/equipment-auth.tsx src/components/layouts/admin-layout.tsx
          git commit -m 'fix: make equipment authorization collapsible and add preview print send'
          git push
          git rm .github/workflows/fix-equipment-auth-ui.yml
          git commit -m 'chore: remove temporary equipment auth workflow'
          git push
