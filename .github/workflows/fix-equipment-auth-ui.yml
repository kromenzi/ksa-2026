name: Fix equipment authorization UI

on:
  push:
    paths:
      - '.github/workflows/fix-equipment-auth-ui.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # ---------- Sidebar ----------
          p = Path('src/components/layouts/admin-layout.tsx')
          s = p.read_text(encoding='utf-8')

          if 'children?: NavItem[];' not in s:
              s = s.replace('  bgColor: string;\n}', '  bgColor: string;\n  children?: NavItem[];\n}', 1)

          if 'const [collapsedItems' not in s:
              s = s.replace('  const [collapsedGroups, setCollapsedGroups] = useState<Record<number, boolean>>({});', '  const [collapsedGroups, setCollapsedGroups] = useState<Record<number, boolean>>({});\n  const [collapsedItems, setCollapsedItems] = useState<Record<string, boolean>>({});', 1)
              s = s.replace('  const toggleGroup = (index: number) => {', '  const toggleItem = (key: string) => {\n    setCollapsedItems(prev => ({ ...prev, [key]: !(prev[key] ?? true) }));\n  };\n\n  const toggleGroup = (index: number) => {', 1)

          # Restore one parent group: Licenses & Equipment Authorization, with Equipment Authorization nested inside it.
          start = s.find('    {\n      title: "Licenses & Training",')
          if start < 0:
              start = s.find('    {\n      title: "Licenses & Equipment Authorization",')
          end = s.find('    {\n      title: "Assets & Emergency",', start)
          if start >= 0 and end > start:
              replacement = '''    {\n      title: "Licenses & Equipment Authorization",\n      titleAr: "التراخيص وتفويض المعدات",\n      items: [\n        { label: isAr ? 'لوحة القيادة' : 'Dashboard', icon: LayoutDashboard, href: "/admin/licenses", visible: true, color: "text-blue-500", bgColor: "bg-blue-500/10" },\n        { label: isAr ? 'التراخيص' : 'Licenses', icon: CreditCard, href: "/admin/licenses", visible: true, color: "text-amber-500", bgColor: "bg-amber-500/10" },\n        { label: isAr ? 'التدريب والكفاءة' : 'Training & Competency', icon: GraduationCap, href: "/admin/trainings", visible: true, color: "text-indigo-500", bgColor: "bg-indigo-500/10" },\n        {\n          label: isAr ? 'تفويض المعدات' : 'Equipment Authorization',\n          icon: ShieldCheck, href: "/admin/equipment-auth", visible: true, color: "text-emerald-500", bgColor: "bg-emerald-500/10",\n          children: [\n            { label: isAr ? 'لوحة تفويض المعدات' : 'Authorization Dashboard', icon: ShieldCheck, href: "/admin/equipment-auth", visible: true, color: "text-emerald-500", bgColor: "bg-emerald-500/10" },\n            { label: isAr ? 'رافعة شوكية (Forklift)' : 'Forklift', icon: Truck, href: "/admin/equipment-auth", visible: true, color: "text-blue-600", bgColor: "bg-blue-600/10" },\n            { label: isAr ? 'ونش علوي (Overhead Crane)' : 'Overhead Crane', icon: Wrench, href: "/admin/equipment-auth", visible: true, color: "text-orange-500", bgColor: "bg-orange-500/10" },\n            { label: isAr ? 'رافعات الأفراد (Lifter / Manlift)' : 'Lifter / Manlift', icon: Activity, href: "/admin/equipment-auth", visible: true, color: "text-purple-500", bgColor: "bg-purple-500/10" },\n            { label: isAr ? 'منصات العمل المتحركة (MEWP)' : 'MEWP', icon: Truck, href: "/admin/equipment-auth", visible: true, color: "text-cyan-500", bgColor: "bg-cyan-500/10" },\n            { label: isAr ? 'الربط والإشارات (Rigging & Banksman)' : 'Rigging & Banksman', icon: Award, href: "/admin/equipment-auth", visible: true, color: "text-amber-600", bgColor: "bg-amber-600/10" },\n            { label: isAr ? 'التفويض الكهربائي (Electrical)' : 'Electrical Authorization', icon: Zap, href: "/admin/equipment-auth", visible: true, color: "text-yellow-500", bgColor: "bg-yellow-500/10" },\n            { label: isAr ? 'عزل الطاقة (LOTO)' : 'LOTO Authorization', icon: Lock, href: "/admin/equipment-auth", visible: true, color: "text-rose-600", bgColor: "bg-rose-600/10" },\n            { label: isAr ? 'العمل على ارتفاعات' : 'Work at Height', icon: ShieldAlert, href: "/admin/equipment-auth", visible: true, color: "text-sky-600", bgColor: "bg-sky-600/10" },\n            { label: isAr ? 'الأماكن المغلقة' : 'Confined Space', icon: AlertTriangle, href: "/admin/equipment-auth", visible: true, color: "text-red-500", bgColor: "bg-red-500/10" },\n          ]\n        },\n        { label: isAr ? 'العناصر منتهية الصلاحية' : 'Expiring Items', icon: Clock, href: "/admin/licenses", visible: true, color: "text-amber-500", bgColor: "bg-amber-500/10" },\n        { label: isAr ? 'مصفوفة الكفاءة' : 'Competency Matrix', icon: Grid, href: "/admin/training-matrix", visible: true, color: "text-teal-500", bgColor: "bg-teal-500/10" },\n        { label: isAr ? 'تقارير التفويض' : 'Authorization Reports', icon: ScrollText, href: "/admin/enterprise-reports", visible: true, color: "text-slate-400", bgColor: "bg-slate-500/10" },\n      ]\n    },\n'''
              s = s[:start] + replacement + s[end:]

          # Render nested nav items in expanded/mobile mode.
          marker = '''                const uniqueKey = `${item.href}-${ii}`;\n                \n                if (isCollapsed && !mobile) {'''
          if marker not in s:
              raise SystemExit('sidebar render marker not found')
          nested = '''                const uniqueKey = `${item.href}-${ii}`;\n                const hasChildren = Boolean(item.children?.length);\n                const childKey = `${gi}-${ii}`;\n                const isItemCollapsed = collapsedItems[childKey] ?? true;\n                \n                if (isCollapsed && !mobile) {'''
          s = s.replace(marker, nested, 1)

          old = '''                return (\n                  <Link key={uniqueKey} href={item.href}>\n                    <div \n                      className={cn(\n                        "flex items-center gap-2.5 px-2.5 py-1.5 rounded-lg text-[11.5px] font-medium transition-all duration-150 cursor-pointer group relative mx-1 mb-0.5",\n                        isActive \n                          ? "bg-primary/15 text-white shadow-sm ring-1 ring-primary/30 font-semibold" \n                          : "text-white/70 hover:bg-white/[0.05] hover:text-white"\n                      )}\n                      onClick={() => setIsMobileOpen(false)}\n                    >\n                      {isActive && (\n                        <div className="absolute inset-y-1.5 start-0 w-[3px] rounded-full bg-primary shadow-[0_0_8px_rgba(59,130,246,0.6)]" />\n                      )}\n                      <div className={cn(\n                        "h-6 w-6 rounded-md flex items-center justify-center transition-all duration-150 shrink-0",\n                        isActive ? item.bgColor : "bg-white/[0.03] group-hover:bg-white/[0.07]"\n                      )}>\n                        <ItemIcon className={cn(\n                          "h-3.5 w-3.5 transition-all duration-150",\n                          isActive ? item.color : "text-white/50 group-hover:text-white"\n                        )} />\n                      </div>\n                      <span className="truncate leading-none">{item.label}</span>\n                      {isActive && (\n                        <ChevronRight className="h-3 w-3 ms-auto text-primary/70 rtl:rotate-180 shrink-0" />\n                      )}\n                    </div>\n                  </Link>\n                );'''
          new = '''                if (hasChildren) {\n                  return (\n                    <div key={uniqueKey} className="mb-1">\n                      <button type="button" onClick={() => toggleItem(childKey)} className={cn(\n                        "w-full flex items-center gap-2.5 px-2.5 py-1.5 rounded-lg text-[11.5px] font-semibold transition-all duration-150 group relative mx-1 mb-0.5 text-white/80 hover:bg-white/[0.05] hover:text-white"\n                      )}>\n                        <div className="h-6 w-6 rounded-md flex items-center justify-center bg-emerald-500/10 shrink-0"><ItemIcon className={cn("h-3.5 w-3.5", item.color)} /></div>\n                        <span className="truncate leading-none flex-1 text-start">{item.label}</span>\n                        <ChevronDown className={cn("h-3.5 w-3.5 text-white/60 transition-transform", isItemCollapsed && "-rotate-90 rtl:rotate-90")} />\n                      </button>\n                      {!isItemCollapsed && (item.children || []).filter(child => child.visible).map((child, ci) => {\n                        const ChildIcon = child.icon;\n                        const childActive = location === child.href || location.startsWith(`${child.href}/`);\n                        return <Link key={`${child.href}-${ci}`} href={child.href}>\n                          <div className={cn(\n                            "flex items-center gap-2 px-2 py-1.5 rounded-lg text-[10.5px] transition-all mx-3 mb-0.5 border border-transparent",\n                            childActive ? "bg-primary/15 text-white ring-1 ring-primary/20" : "text-white/60 hover:text-white hover:bg-white/[0.04]"\n                          )} onClick={() => setIsMobileOpen(false)}>\n                            <div className={cn("h-5 w-5 rounded-md flex items-center justify-center", childActive ? child.bgColor : "bg-white/[0.03]")}><ChildIcon className={cn("h-3 w-3", childActive ? child.color : "text-white/50")} /></div>\n                            <span className="truncate">{child.label}</span>\n                          </div>\n                        </Link>;\n                      })}\n                    </div>\n                  );\n                }\n\n                return (\n                  <Link key={uniqueKey} href={item.href}>\n                    <div className={cn(\n                      "flex items-center gap-2.5 px-2.5 py-1.5 rounded-lg text-[11.5px] font-medium transition-all duration-150 cursor-pointer group relative mx-1 mb-0.5",\n                      isActive ? "bg-primary/15 text-white shadow-sm ring-1 ring-primary/30 font-semibold" : "text-white/70 hover:bg-white/[0.05] hover:text-white"\n                    )} onClick={() => setIsMobileOpen(false)}>\n                      {isActive && <div className="absolute inset-y-1.5 start-0 w-[3px] rounded-full bg-primary shadow-[0_0_8px_rgba(59,130,246,0.6)]" />}\n                      <div className={cn("h-6 w-6 rounded-md flex items-center justify-center transition-all duration-150 shrink-0", isActive ? item.bgColor : "bg-white/[0.03] group-hover:bg-white/[0.07]")}>\n                        <ItemIcon className={cn("h-3.5 w-3.5 transition-all duration-150", isActive ? item.color : "text-white/50 group-hover:text-white")} />\n                      </div>\n                      <span className="truncate leading-none">{item.label}</span>\n                      {isActive && <ChevronRight className="h-3 w-3 ms-auto text-primary/70 rtl:rotate-180 shrink-0" />}\n                    </div>\n                  </Link>\n                );'''
          if old not in s:
              raise SystemExit('sidebar item render block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # ---------- Equipment Authorization page ----------
          eq = Path('src/pages/admin/equipment-auth.tsx')
          e = eq.read_text(encoding='utf-8')
          if 'Eye,' not in e:
              e = e.replace('  Trash2\n} from "lucide-react";', '  Trash2,\n  Eye,\n  Printer,\n  Send,\n  Mail\n} from "lucide-react";', 1)
          if 'const [isPreviewOpen' not in e:
              e = e.replace('  const [activeAuth, setActiveAuth] = useState<EquipmentAuth | null>(null);\n', '  const [activeAuth, setActiveAuth] = useState<EquipmentAuth | null>(null);\n  const [isPreviewOpen, setIsPreviewOpen] = useState(false);\n  const [isSendOpen, setIsSendOpen] = useState(false);\n  const [sendEmail, setSendEmail] = useState("");\n', 1)
          if 'const handlePrintAuth' not in e:
              marker = '  const filtered = authorizations.filter(item => {\n'
              helper = '''  const handlePrintAuth = (auth: EquipmentAuth) => {\n    const popup = window.open("", "_blank", "width=1100,height=850");\n    if (!popup) { toast.error(isAr ? "اسمح بالنوافذ المنبثقة للطباعة" : "Allow pop-ups to print"); return; }\n    const escapeHtml = (v: string) => v.replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]!));\n    popup.document.write(`<!doctype html><html dir="${isAr ? 'rtl' : 'ltr'}"><head><meta charset="utf-8"><title>${escapeHtml(auth.certificateNo)}</title><style>@page{size:A4 landscape;margin:10mm}body{font-family:Arial,Tahoma,sans-serif;background:#fff;color:#0f172a;margin:0}.sheet{border:4px solid #0f766e;border-radius:18px;padding:30px;min-height:185mm;box-sizing:border-box}.brand{font-size:26px;font-weight:800;color:#0f766e}.head{display:flex;justify-content:space-between;border-bottom:2px solid #d1d5db;padding-bottom:15px}.title{font-size:24px;font-weight:800;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.cell{border:1px solid #cbd5e1;border-radius:9px;padding:10px}.label{font-size:10px;color:#64748b}.value{font-size:14px;font-weight:700;margin-top:3px}.footer{margin-top:28px;display:grid;grid-template-columns:repeat(3,1fr);gap:30px;text-align:center;font-size:11px}.sig{border-top:1px solid #64748b;padding-top:6px}</style></head><body><div class="sheet"><div class="head"><div><div class="brand">ABDULKAREM SAFETY BOARD</div><div style="color:#64748b">${isAr ? 'تفويض رسمي لتشغيل المعدة' : 'Official Equipment Authorization'}</div></div><div style="font-weight:700">${escapeHtml(auth.certificateNo)}</div></div><div class="title">${isAr ? 'تفويض رسمي لتشغيل المعدة' : 'OFFICIAL EQUIPMENT AUTHORIZATION'}</div><div class="grid"><div class="cell"><div class="label">${isAr ? 'اسم الموظف' : 'Employee Name'}</div><div class="value">${escapeHtml(auth.employeeName)}</div></div><div class="cell"><div class="label">${isAr ? 'الرقم الوظيفي' : 'Employee ID'}</div><div class="value">${escapeHtml(auth.employeeId)}</div></div><div class="cell"><div class="label">${isAr ? 'القسم' : 'Department'}</div><div class="value">${escapeHtml(auth.department)}</div></div><div class="cell"><div class="label">${isAr ? 'الفئة' : 'Category'}</div><div class="value">${escapeHtml(auth.category)}</div></div><div class="cell"><div class="label">${isAr ? 'المعدة' : 'Equipment'}</div><div class="value">${escapeHtml(auth.equipmentModel || '—')}</div></div><div class="cell"><div class="label">${isAr ? 'رقم الشهادة' : 'Certificate No.'}</div><div class="value">${escapeHtml(auth.certificateNo)}</div></div><div class="cell"><div class="label">${isAr ? 'الإصدار' : 'Issue Date'}</div><div class="value">${escapeHtml(auth.issueDate)}</div></div><div class="cell"><div class="label">${isAr ? 'الانتهاء' : 'Expiry Date'}</div><div class="value">${escapeHtml(auth.expiryDate)}</div></div><div class="cell"><div class="label">${isAr ? 'الحالة' : 'Status'}</div><div class="value">${escapeHtml(auth.status)}</div></div></div><div style="margin-top:16px"><b>${isAr ? 'مرجع التدريب:' : 'Training Ref:'}</b> ${escapeHtml(auth.trainingRef || '—')} &nbsp; <b>${isAr ? 'المقيم:' : 'Assessor:'}</b> ${escapeHtml(auth.assessorName || '—')}</div><div class="footer"><div class="sig">HSE Manager / مدير السلامة</div><div class="sig">Assessor / المقيم</div><div class="sig">Employee / الموظف</div></div></div><script>setTimeout(()=>window.print(),250)</script></body></html>`);\n    popup.document.close();\n  };\n\n  const handleSendAuth = () => {\n    if (!activeAuth) return;\n    const email = sendEmail.trim();\n    if (!email) { toast.error(isAr ? "أدخل البريد الإلكتروني" : "Enter an email address"); return; }\n    const subject = `${isAr ? 'تفويض معدات' : 'Equipment Authorization'} - ${activeAuth.certificateNo}`;\n    const body = `${isAr ? 'تفويض تشغيل معدات رسمي' : 'Official Equipment Authorization'}\\n\\nEmployee: ${activeAuth.employeeName}\\nEmployee ID: ${activeAuth.employeeId}\\nCategory: ${activeAuth.category}\\nEquipment: ${activeAuth.equipmentModel || '—'}\\nCertificate: ${activeAuth.certificateNo}\\nIssue: ${activeAuth.issueDate}\\nExpiry: ${activeAuth.expiryDate}\\nStatus: ${activeAuth.status}`;\n    window.location.href = `mailto:${encodeURIComponent(email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;\n    setIsSendOpen(false);\n  };\n\n'''
              e = e.replace(marker, helper + marker, 1)
          if '<Eye className="h-4 w-4" />' not in e:
              # Locate the existing QR/Delete action block by broad regex.
              pattern = re.compile(r'\s*<td className="py-4 px-5 text-end">\s*<div className="flex items-center justify-end gap-1\.5">.*?<\/td>', re.S)
              m = pattern.search(e)
              if not m:
                  raise SystemExit('equipment action cell not found')
              action = '''\n                    <td className="py-4 px-5 text-end">\n                      <div className="flex items-center justify-end gap-1.5 flex-wrap">\n                        <Button variant="ghost" size="icon" className="h-8 w-8 rounded-xl text-blue-500 hover:bg-blue-500/10" title={isAr ? "معاينة" : "Preview"} onClick={() => { setActiveAuth(item); setIsPreviewOpen(true); }}><Eye className="h-4 w-4" /></Button>\n                        <Button variant="ghost" size="icon" className="h-8 w-8 rounded-xl text-violet-500 hover:bg-violet-500/10" title={isAr ? "طباعة" : "Print"} onClick={() => handlePrintAuth(item)}><Printer className="h-4 w-4" /></Button>\n                        <Button variant="ghost" size="icon" className="h-8 w-8 rounded-xl text-emerald-500 hover:bg-emerald-500/10" title={isAr ? "إرسال" : "Send"} onClick={() => { setActiveAuth(item); setIsSendOpen(true); }}><Send className="h-4 w-4" /></Button>\n                        <Button variant="ghost" size="icon" className="h-8 w-8 rounded-xl text-cyan-500 hover:bg-cyan-500/10" title={isAr ? "عرض QR" : "View QR"} onClick={() => { setActiveAuth(item); setIsViewQRModal(true); }}><QrCode className="h-4 w-4" /></Button>\n                        <Button variant="ghost" size="icon" className="h-8 w-8 rounded-xl text-red-500 hover:bg-red-500/10" title={isAr ? "حذف" : "Delete"} onClick={() => deleteAuth(item.id)}><Trash2 className="h-4 w-4" /></Button>\n                      </div>\n                    </td>'''
              e = e[:m.start()] + action + e[m.end():]
          if 'معاينة تفويض المعدات' not in e:
              marker = '      <Dialog open={isViewQRModal} onOpenChange={setIsViewQRModal}>\n'
              if marker not in e:
                  raise SystemExit('QR dialog marker not found')
              dialogs = '''      <Dialog open={isPreviewOpen} onOpenChange={setIsPreviewOpen}>\n        <DialogContent className="max-w-3xl rounded-3xl p-0 overflow-hidden">\n          <DialogHeader className="px-6 pt-6"><DialogTitle>{isAr ? 'معاينة تفويض المعدات' : 'Equipment Authorization Preview'}</DialogTitle><DialogDescription>{isAr ? 'معاينة المستند الرسمي قبل الطباعة.' : 'Preview the official authorization before printing.'}</DialogDescription></DialogHeader>\n          {activeAuth && <div className="mx-6 mb-6 border-4 border-emerald-700 rounded-3xl bg-white text-slate-900 p-7 shadow-xl" dir={isAr ? 'rtl' : 'ltr'}><div className="flex items-start justify-between border-b pb-5"><div><div className="text-2xl font-extrabold text-emerald-700">ABDULKAREM SAFETY BOARD</div><div className="text-sm text-slate-500">{isAr ? 'تفويض رسمي لتشغيل المعدة' : 'OFFICIAL EQUIPMENT AUTHORIZATION'}</div></div><div className="rounded-xl border px-3 py-2 text-xs font-bold">{activeAuth.certificateNo}</div></div><div className="grid grid-cols-1 md:grid-cols-3 gap-3 mt-5">{[[isAr?'اسم الموظف':'Employee Name',activeAuth.employeeName],[isAr?'الرقم الوظيفي':'Employee ID',activeAuth.employeeId],[isAr?'القسم':'Department',activeAuth.department],[isAr?'الفئة':'Category',activeAuth.category],[isAr?'المعدة':'Equipment',activeAuth.equipmentModel||'—'],[isAr?'الإصدار':'Issue Date',activeAuth.issueDate],[isAr?'الانتهاء':'Expiry Date',activeAuth.expiryDate],[isAr?'الحالة':'Status',activeAuth.status],[isAr?'مرجع التدريب':'Training Ref',activeAuth.trainingRef||'—']].map(([label,value]) => <div key={String(label)} className="border rounded-xl p-3"><div className="text-xs text-slate-500">{label}</div><div className="font-bold mt-1">{value}</div></div>)}</div><div className="mt-6 grid grid-cols-3 gap-6 text-center text-xs text-slate-600"><div className="border-t pt-2">HSE Manager</div><div className="border-t pt-2">Assessor</div><div className="border-t pt-2">Employee</div></div></div>}\n          <DialogFooter className="px-6 pb-6"><Button variant="outline" onClick={() => setIsPreviewOpen(false)}>{isAr ? 'إغلاق' : 'Close'}</Button>{activeAuth && <Button onClick={() => handlePrintAuth(activeAuth)} className="gap-2"><Printer className="h-4 w-4" />{isAr ? 'طباعة' : 'Print'}</Button>}</DialogFooter>\n        </DialogContent>\n      </Dialog>\n\n      <Dialog open={isSendOpen} onOpenChange={setIsSendOpen}>\n        <DialogContent className="sm:max-w-md rounded-3xl p-6">\n          <DialogHeader><DialogTitle>{isAr ? 'إرسال تفويض المعدات' : 'Send Equipment Authorization'}</DialogTitle><DialogDescription>{isAr ? 'سيتم فتح تطبيق البريد لإرسال بيانات التفويض.' : 'Your email app will open with the authorization details.'}</DialogDescription></DialogHeader>\n          {activeAuth && <div className="space-y-4"><div className="rounded-2xl border p-4 bg-muted/30"><div className="font-bold">{activeAuth.employeeName}</div><div className="text-sm text-muted-foreground">{activeAuth.certificateNo} • {activeAuth.category}</div></div><div className="space-y-2"><Label>{isAr ? 'البريد الإلكتروني' : 'Email Address'}</Label><div className="relative"><Mail className="absolute start-3 top-1/2 -translate-y-1/2 h-4 w-4 text-muted-foreground" /><Input type="email" className="ps-9 rounded-2xl" value={sendEmail} onChange={e => setSendEmail(e.target.value)} placeholder="name@example.com" /></div></div></div>}\n          <DialogFooter><Button variant="outline" onClick={() => setIsSendOpen(false)}>{isAr ? 'إلغاء' : 'Cancel'}</Button><Button onClick={handleSendAuth} className="gap-2 bg-emerald-600 hover:bg-emerald-700 text-white"><Send className="h-4 w-4" />{isAr ? 'إرسال' : 'Send'}</Button></DialogFooter>\n        </DialogContent>\n      </Dialog>\n\n'''
              e = e.replace(marker, dialogs + marker, 1)
          eq.write_text(e, encoding='utf-8')

          print('equipment authorization nesting and actions patched')
          PY

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Verify and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('src/components/layouts/admin-layout.tsx').read_text(encoding='utf-8')
          e = Path('src/pages/admin/equipment-auth.tsx').read_text(encoding='utf-8')
          for needle in ['children?: NavItem[];', 'collapsedItems', 'title: "Licenses & Equipment Authorization"', 'titleAr: "التراخيص وتفويض المعدات"']:
            assert needle in s, needle
          for needle in ['handlePrintAuth', 'handleSendAuth', 'isPreviewOpen', 'Eye', 'Printer', 'Send']:
            assert needle in e, needle
          print('verified')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/layouts/admin-layout.tsx src/pages/admin/equipment-auth.tsx
          git commit -m 'fix: nest equipment authorization and add preview print send'
          git push
          git rm .github/workflows/fix-equipment-auth-ui.yml
          git commit -m 'chore: remove temporary equipment authorization workflow'
          git push
