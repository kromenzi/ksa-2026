name: Fix Risk Table Image Print

# Trigger repair for the Risk Assessment Matrix 5x5 image-print button.

on:
  push:
    paths:
      - '.github/workflows/fix-risk-table-image-print.yml'
      - 'scripts/fix-risk-table-print.py'
      - 'src/pages/admin/risk-assessment.tsx'

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/fix-risk-table-print.py
      - name: Verify
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('src/pages/admin/risk-assessment.tsx').read_text(encoding='utf-8')
          assert 'foreignObject' not in s
          assert 'window.open("", "_blank", "width=1200,height=900")' in s
          assert 'canvas.toDataURL("image/png")' in s
          print('Risk image print handler verified')
          PY
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Commit repair and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/admin/risk-assessment.tsx
          git commit -m 'fix: repair risk table image printing'
          git push
          git rm .github/workflows/fix-risk-table-image-print.yml scripts/fix-risk-table-print.py
          git commit -m 'chore: remove temporary risk print repair'
          git push
