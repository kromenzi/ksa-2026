name: Verify NCR Pyramid Classification
on:
  push:
    branches: [fix/ncr-pyramid-classification-20260906]
    paths:
      - ".github/workflows/verify-ncr-pyramid-classification.yml"
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct NCR pyramid classification
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          page = Path('src/pages/admin/safety-pyramid.tsx')
          text = page.read_text(encoding='utf-8')
          old = '''function classifyNcr(r: any): LevelId {
            const severity = String(r.severity || "").toLowerCase();
            const text = String(r.description || "").toLowerCase();
            if (text.includes("fatal")) return "fatality";
            if (text.includes("lost time") || text.includes("lti")) return "lostTime";
            if (text.includes("restricted") || text.includes("rwd")) return "restrictedWork";
            if (text.includes("medical") || text.includes("mtc") || text.includes("hospital")) return "medicalTreatment";
            if (text.includes("first aid") || text.includes("fac")) return "firstAid";
            if (text.includes("near miss") || text.includes("near-miss")) return "nearMiss";
            if (severity === "critical") return "lostTime";
            if (severity === "high") return "medicalTreatment";
            return "unsafeActs";
          }'''
          new = '''function classifyNcr(r: any): LevelId {
            const text = String(r.description || "").toLowerCase();
            if (text.includes("fatal")) return "fatality";
            if (text.includes("lost time") || text.includes("lti")) return "lostTime";
            if (text.includes("restricted") || text.includes("rwd")) return "restrictedWork";
            if (text.includes("medical") || text.includes("mtc") || text.includes("hospital")) return "medicalTreatment";
            if (text.includes("first aid") || text.includes("fac") || text.includes("clinic")) return "firstAid";
            if (text.includes("near miss") || text.includes("near-miss")) return "nearMiss";
            return "unsafeActs";
          }'''
          if old not in text:
              raise SystemExit('Safety Pyramid NCR classifier anchor not found')
          page.write_text(text.replace(old, new, 1), encoding='utf-8')

          component = Path('src/components/incident-pyramid.tsx')
          text = component.read_text(encoding='utf-8')
          old = '''const sev=(ncr.severity||"").toLowerCase();const desc=(ncr.description||"").toLowerCase();let levelId="unsafeActs";if(sev==="critical"&&(desc.includes("fatality")||desc.includes("fatal")))levelId="fatality";else if(sev==="critical"||desc.includes("lost time"))levelId="lostTime";else if(desc.includes("restricted"))levelId="restrictedWork";else if(sev==="high"||desc.includes("medical"))levelId="medicalTreatment";else if(sev==="medium"&&desc.includes("first aid"))levelId="firstAid";else if(desc.includes("near miss")||desc.includes("near-miss"))levelId="nearMiss";'''
          new = '''const desc=(ncr.description||"").toLowerCase();let levelId="unsafeActs";if(desc.includes("fatality")||desc.includes("fatal"))levelId="fatality";else if(desc.includes("lost time")||desc.includes("lti"))levelId="lostTime";else if(desc.includes("restricted")||desc.includes("rwd"))levelId="restrictedWork";else if(desc.includes("medical")||desc.includes("mtc")||desc.includes("hospital"))levelId="medicalTreatment";else if(desc.includes("first aid")||desc.includes("fac")||desc.includes("clinic"))levelId="firstAid";else if(desc.includes("near miss")||desc.includes("near-miss"))levelId="nearMiss";'''
          if old not in text:
              raise SystemExit('Dashboard pyramid NCR classifier anchor not found')
          component.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Commit verified source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/safety-pyramid.tsx src/components/incident-pyramid.tsx
          if git diff --cached --quiet; then
            echo "No source changes"
            exit 0
          fi
          git commit -m "fix: classify NCRs safely in incident pyramids"
          git push origin HEAD:fix/ncr-pyramid-classification-20260906
