name: Repair NCR Production Data

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'chore: apply NCR production repair'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch NCR department migration and preview
        shell: python
        run: |
          from pathlib import Path

          context = Path('src/lib/data-context.tsx')
          text = context.read_text(encoding='utf-8')

          old = ' const settings={...emptySettings,...remoteSettings,language:localLanguage};'
          new = r''' useEffect(() => {
   if (!isAuthenticated) return;
   const migrationKey = "safety-board-departments-migrated-v1";
   try {
     if (localStorage.getItem(migrationKey)) return;
     const raw = localStorage.getItem("safety_board_sections_v1");
     if (!raw) return;
     const legacy = JSON.parse(raw);
     if (!Array.isArray(legacy) || legacy.length === 0) return;
     localStorage.setItem(migrationKey, "pending");
     void (async () => {
       let allSucceeded = true;
       for (const item of legacy) {
         const name = String(item?.name || item?.nameAr || "").trim();
         if (!name) continue;
         const code = String(item?.code || "").trim() || `DEPT-${Math.random().toString(36).slice(2, 7).toUpperCase()}`;
         const exists = departments.some(d => String(d.name).trim().toLowerCase() === name.toLowerCase() || (d.code && String(d.code).trim().toLowerCase() === code.toLowerCase()));
         if (exists) continue;
         try {
           const response = await apiRequest("POST", "/api/departments", { name, code });
           if (!response.ok) allSucceeded = false;
         } catch {
           allSucceeded = false;
         }
       }
       if (allSucceeded) {
         localStorage.setItem(migrationKey, "done");
         invalidate("/api/departments");
       } else {
         localStorage.removeItem(migrationKey);
       }
     })();
   } catch {
     localStorage.removeItem(migrationKey);
   }
 }, [isAuthenticated, departments]);

 const settings={...emptySettings,...remoteSettings,language:localLanguage};'''
          if old in text and new not in text:
              text = text.replace(old, new, 1)
              context.write_text(text, encoding='utf-8')

          form = Path('src/pages/admin/ncr/form.tsx')
          text = form.read_text(encoding='utf-8')

          old_preview_style = 'style={{ width: "210mm", minHeight: "297mm", transform: "scale(0.48)", transformOrigin: "top left", fontFamily: "Arial, sans-serif", padding: "8mm" }}'
          new_preview_style = 'style={{ width: "210mm", minHeight: "297mm", fontFamily: "Arial, sans-serif", padding: "8mm", boxSizing: "border-box" }}'
          if old_preview_style in text:
              text = text.replace(old_preview_style, new_preview_style, 1)

          old_preview = '''        <div className="hidden lg:block w-[400px] flex-shrink-0 sticky top-4">
          <div className="overflow-hidden rounded-lg border bg-gray-50" style={{ height: "calc(100vh - 120px)", overflow: "auto" }}>
            <A4Preview formData={formData} />
          </div>
        </div>'''
          new_preview = '''        <div className="hidden lg:block w-[400px] flex-shrink-0 sticky top-4">
          <div className="rounded-lg border bg-gray-50 p-3" style={{ height: "calc(100vh - 120px)", overflow: "auto" }}>
            <div style={{ width: "381px", height: "540px", margin: "0 auto", overflow: "hidden", position: "relative" }}>
              <div style={{ width: "210mm", minHeight: "297mm", transform: "scale(0.48)", transformOrigin: "top center", fontFamily: "Arial, sans-serif" }}>
                <A4Preview formData={formData} />
              </div>
            </div>
          </div>
        </div>'''
          if old_preview in text:
              text = text.replace(old_preview, new_preview, 1)

          old_empty = '''                    ) : (
                      <SelectItem value="General" disabled>No Departments Configured</SelectItem>
                    )}'''
          new_empty = '''                    ) : (
                      <SelectItem value="__none__" disabled>
                        {isAr ? "لا توجد أقسام حالياً — أضف قسمًا من الإعدادات" : "No departments configured — add one from Departments settings"}
                      </SelectItem>
                    )}'''
          if old_empty in text:
              text = text.replace(old_empty, new_empty, 1)

          form.write_text(text, encoding='utf-8')

      - name: Commit repaired NCR files and remove repair workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/data-context.tsx src/pages/admin/ncr/form.tsx .github/workflows/repair-ncr.yml
          git rm .github/workflows/repair-ncr.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore: apply NCR production repair"
          git push origin HEAD:main
