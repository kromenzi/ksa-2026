name: Fix Settings Syntax

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[settings-syntax-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair settings.tsx syntax
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('src/pages/admin/settings.tsx')
          s = p.read_text(encoding='utf-8')

          marker = '  return (\n    <div className="space-y-6 max-w-7xl mx-auto pb-12">'
          if 'const handleLogoUpload = ' not in s:
              helper = '''  const handleLogoUpload = (e: any) => {\n    const file = e.target.files?.[0];\n    if (!file) return;\n    const reader = new FileReader();\n    reader.onload = (event: any) => {\n      const result = event.target?.result;\n      if (result) {\n        setCompanyData({...companyData, logoUrl: result as string});\n        toast.success(isAr ? 'تم تحميل الشعار بنجاح! اضغط حفظ التغييرات' : 'Logo uploaded! Click save to apply.');\n      }\n    };\n    reader.readAsDataURL(file);\n  };\n\n'''
              if marker not in s:
                  raise SystemExit('return marker not found')
              s = s.replace(marker, helper + marker, 1)

          logo_pattern = r'<input type="file" accept="image/\*" className="hidden" onChange=\{\(e\) => \{.*?\}\} />'
          s, logo_count = re.subn(logo_pattern, '<input type="file" accept="image/*" className="hidden" onChange={handleLogoUpload} />', s, count=1, flags=re.DOTALL)
          if logo_count != 1:
              raise SystemExit(f'logo handler replacement failed: {logo_count}')

          permission_pattern = r'<TabsContent value="permissions".*?</TabsContent>'
          permission_replacement = '''<TabsContent value="permissions" className="mt-4 space-y-6">\n  <Card className="rounded-2xl border-border/60 shadow-sm">\n    <CardHeader>\n      <div className="flex items-center gap-2">\n        <Users className="h-5 w-5 text-pink-500" />\n        <CardTitle className="text-base">{isAr ? 'مصفوفة صلاحيات الأدوار' : 'Role Access Control Matrix'}</CardTitle>\n      </div>\n    </CardHeader>\n    <CardContent className="space-y-4 text-xs">\n      <div className="border border-border/50 rounded-xl overflow-hidden">\n        <Table>\n          <TableHeader className="bg-muted/40">\n            <TableRow>\n              <TableHead className="text-xs">{isAr ? 'الدور' : 'Role'}</TableHead>\n              <TableHead className="text-xs">{isAr ? 'القسم' : 'Module'}</TableHead>\n              {actions.map(act => (\n                <TableHead key={act} className="text-xs text-center capitalize">{act}</TableHead>\n              ))}\n            </TableRow>\n          </TableHeader>\n          <TableBody>\n            {roles.flatMap(r => modules.map(m => (\n              <TableRow key={`${r}-${m}`} className="h-9">\n                <TableCell className="font-bold text-xs uppercase text-primary">{r}</TableCell>\n                <TableCell className="font-medium text-xs capitalize">{m}</TableCell>\n                {actions.map(act => (\n                  <TableCell key={act} className="text-center">\n                    <Checkbox checked={hasPermissionRow(r, m, act)} onCheckedChange={() => togglePermission(r, m, act)} />\n                  </TableCell>\n                ))}\n              </TableRow>\n            )))}\n          </TableBody>\n        </Table>\n      </div>\n    </CardContent>\n  </Card>\n</TabsContent>'''
          s, permission_count = re.subn(permission_pattern, permission_replacement, s, count=1, flags=re.DOTALL)
          if permission_count != 1:
              raise SystemExit(f'permissions section replacement failed: {permission_count}')

          p.write_text(s, encoding='utf-8')
      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/admin/settings.tsx
          git commit -m 'fix: repair settings syntax [settings-syntax-fixed]' || exit 0
          git push
      - name: Remove one-time workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-settings-syntax.yml
          git add .github/workflows/fix-settings-syntax.yml
          git commit -m 'chore: remove settings syntax repair workflow' || exit 0
          git push
