name: Fix Risk Table Image Print

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch source
        run: python scripts/patch-risk-table-image.py
      - name: Commit source change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/admin/risk-assessment.tsx
          git commit -m 'feat: print risk assessment table as image [risk-table-image-print]' || true
          git push
      - name: Remove temporary tooling
        run: |
          rm -f scripts/patch-risk-table-image.py .github/workflows/fix-risk-table-print.yml .github/workflows/add-risk-table-image-print.yml
          git add scripts/patch-risk-table-image.py .github/workflows/fix-risk-table-print.yml .github/workflows/add-risk-table-image-print.yml
          git commit -m 'chore: remove risk table print patch tooling' || true
          git push
