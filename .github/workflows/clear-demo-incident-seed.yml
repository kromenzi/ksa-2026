name: Clear hardcoded demo incident

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clear-demo-incident:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove hardcoded incident seed
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/admin/incidents.tsx')
          s = p.read_text(encoding='utf-8')
          old = 'useState<IncidentRecord[]>([SAMPLE])'
          new = 'useState<IncidentRecord[]>([])'
          if old in s:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/incidents.tsx
          if git diff --cached --quiet; then
            echo "No demo seed change needed."
            exit 0
          fi
          git commit -m "Remove hardcoded incident demo row"
          git push
