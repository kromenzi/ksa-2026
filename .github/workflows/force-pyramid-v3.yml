name: Repair print logo and header scope

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'ci: repair print logo and header scope') && !contains(github.event.head_commit.message, 'fix: print dashboard pyramid from same-page iframe') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch print scope, branding, and dashboard pyramid printer
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          import re

          # Admin top bar: give it a dedicated class so print CSS can hide only this bar.
          p = Path('src/components/layouts/admin-layout.tsx')
          s = p.read_text()
          s = s.replace(
              '<header className="h-[58px] border-b border-border/50',
              '<header className="admin-top-header h-[58px] border-b border-border/50',
              1,
          )
          p.write_text(s)

          # Global print CSS: never hide every HTML <header>.
          p = Path('src/index.css')
          s = p.read_text()
          s = s.replace(
              'aside, [data-testid="admin-sidebar"], nav, header, button, .print\\:hidden, .no-print',
              'aside, [data-testid="admin-sidebar"], nav, .admin-top-header, button, .print\\:hidden, .no-print',
              1,
          )
          p.write_text(s)

          # Global print template: always keep a valid logo source.
          p = Path('src/components/global-print-template.tsx')
          s = p.read_text()
          s = s.replace(
              'const branding = settings.branding || {\n    companyName: settings.siteName,\n    companyLogo: \'/logo.png\',',
              'const branding = {\n    companyName: settings.siteName,\n    companyLogo: \'/logo.png\',',
              1,
          )
          marker = "  const isAr = settings.language === 'ar';"
          if marker in s and "const resolvedLogo = settings.branding?.companyLogo || '/logo.png';" not in s:
              s = s.replace(marker, "  const resolvedLogo = settings.branding?.companyLogo || '/logo.png';\n  const isAr = settings.language === 'ar';", 1)
              s = s.replace('src={branding.companyLogo || "/logo.png"}', 'src={resolvedLogo}', 1)
          p.write_text(s)

          # Dashboard/Safety Pyramid shared printer: print an iframe on the current page.
          # This avoids popup/route/layout/print-preview blank-page failures.
          p = Path('src/components/incident-pyramid.tsx')
          s = p.read_text()
          old = re.compile(r' const popup=window\\.open\\("about:blank","incident-pyramid-dashboard-print","width=1400,height=1000"\\);.*? window\\.setTimeout\\(\\(\\)=>\\{try\\{if\\(!popup\\.closed\\)popup\\.close\\(\\)\\}catch\\{\\}\\},60000\\);', re.S)
          if old.search(s):
              new = ''' const iframe=document.createElement("iframe");
 iframe.setAttribute("title", "Incident Pyramid Print");
 iframe.style.position="fixed";
 iframe.style.inset="0";
 iframe.style.width="100vw";
 iframe.style.height="100vh";
 iframe.style.border="0";
 iframe.style.opacity="0";
 iframe.style.pointerEvents="none";
 iframe.style.zIndex="-1";
 document.body.appendChild(iframe);
 const printDoc=iframe.contentDocument;
 const printWin=iframe.contentWindow;
 if(!printDoc||!printWin){iframe.remove();return;}
 printDoc.open();
 printDoc.write(html);
 printDoc.close();
 const doPrint=()=>{window.setTimeout(()=>{try{printWin.focus();printWin.print();}catch{}} ,200);};
 if(printDoc.fonts?.ready){printDoc.fonts.ready.then(doPrint).catch(doPrint);}else{window.setTimeout(doPrint,350);}
 window.setTimeout(()=>{try{iframe.remove();}catch{}},60000);'''
              s = old.sub(new, s, count=1)
              p.write_text(s)
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.css src/components/layouts/admin-layout.tsx src/components/global-print-template.tsx src/components/incident-pyramid.tsx
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ci: repair print logo and header scope"
          git push
