name: Rework Official Documents

on:
  push:
    paths:
      - '.github/workflows/rework-official-documents.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch official print templates
        run: |
          python - <<'PY'
          from pathlib import Path

          # Ensure license/training print payloads use the supported generic report type.
          for p in [Path('src/pages/admin/licenses.tsx'), Path('src/pages/admin/trainings.tsx')]:
              s = p.read_text(encoding='utf-8')
              s = s.replace('type: "license" as const', 'type: "report" as const')
              s = s.replace('type: "certificate" as const', 'type: "report" as const')
              p.write_text(s, encoding='utf-8')

          p = Path('src/components/print-share-dialog.tsx')
          s = p.read_text(encoding='utf-8')

          marker = '  const ncrImages = (item.images || []).filter((img): img is string => Boolean(img));\n'
          insert = '''  const isOfficialLicense = Boolean(item.refNo && (item.refNo.startsWith("LIC-") || item.refNo.includes("HSE-LIC")));\n  const isTrainingCertificate = Boolean(item.refNo && item.refNo.startsWith("CERT-"));\n\n  const getOfficialSection = (patterns: string[]) => getSectionValue(item, patterns);\n\n  const officialQrText = item.refNo || item.id || item.title || siteName;\n  const officialQrUrl = `https://quickchart.io/qr?text=${encodeURIComponent(officialQrText)}&size=180`;\n\n  const buildOfficialDocumentHtml = () => {\n    const certificate = isTrainingCertificate;\n    const license = isOfficialLicense;\n    if (!certificate && !license) return "";\n\n    const navy = "#17324d";\n    const emerald = "#0f766e";\n    const gold = "#b88928";\n    const ink = "#111827";\n    const paper = "#ffffff";\n    const dir2 = isAr ? "rtl" : "ltr";\n    const align2 = isAr ? "right" : "left";\n    const pageSize = certificate ? "A4 landscape" : "A4 portrait";\n    const labels = certificate\n      ? { en: "CERTIFICATE OF TRAINING", ar: "شهادة إتمام تدريب", introEn: "This is to certify that", introAr: "تشهد الجهة المصدرة بأن", courseEn: "has successfully completed the training program", courseAr: "قد أتم البرنامج التدريبي بنجاح", issueEn: "Issue Date", issueAr: "تاريخ الإصدار", durationEn: "Training Duration", durationAr: "مدة التدريب" }\n      : { en: "OFFICIAL LICENSE / PERMIT", ar: "رخصة / تصريح رسمي", introEn: "This document certifies the holder's authorization for the stated activity.", introAr: "تشهد هذه الوثيقة بأهلية حاملها ومصرحيته للنشاط المحدد.", courseEn: "", courseAr: "", issueEn: "Issue Date", issueAr: "تاريخ الإصدار", durationEn: "Expiry Date", durationAr: "تاريخ الانتهاء" };\n\n    const name = getOfficialSection(certificate ? ["trainee name", "اسم المتدرب"] : ["employee name", "اسم الموظف"]);\n    const course = getOfficialSection(certificate ? ["course title", "اسم الدورة"] : ["license category", "نوع الترخيص", "license name", "مسمى الترخيص"]);\n    const employeeId = getOfficialSection(["employee id", "الرقم الوظيفي"]);\n    const issuer = getOfficialSection(certificate ? ["certified trainer", "المدرب المعتمد"] : ["issuing authority", "جهة الإصدار"]);\n    const issueDate = getOfficialSection(["issue date", "تاريخ الإصدار"]);\n    const expiryDate = getOfficialSection(["expiry date", "تاريخ الانتهاء"]);\n    const duration = getOfficialSection(["date & duration", "تاريخ الانعقاد والمدة"]);\n    const status = getOfficialSection(["certification status", "الاعتماد", "license status", "الحالة الحالية"]);\n    const dept = item.department || getOfficialSection(["department", "القسم"]);\n    const jobTitle = getOfficialSection(["job title", "المسمى الوظيفي"]);\n    const remarks = getOfficialSection(["safety remarks", "ملاحظات السلامة"]);\n\n    const field = (labelEn: string, labelAr: string, value: string, wide=False) => `\n      <div style="${wide ? 'grid-column:1/-1;' : ''}border:1px solid #d9e1e8;border-radius:10px;padding:11px 13px;background:#fbfcfd;">\n        <div style="font-size:10px;font-weight:700;letter-spacing:.06em;color:#64748b;text-transform:uppercase;">${isAr ? labelAr : labelEn}</div>\n        <div style="margin-top:4px;font-size:13px;font-weight:700;color:${ink};white-space:pre-wrap;line-height:1.6;">${escapeHtml(value || (isAr ? 'غير متوفر' : 'N/A'))}</div>\n      </div>`;\n\n    return `<!DOCTYPE html><html dir="${dir2}" lang="${isAr ? 'ar' : 'en'}"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>${escapeHtml(item.refNo || item.title)}</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>\n      *{box-sizing:border-box} body{margin:0;background:#eef2f5;color:${ink};font-family:${isAr ? "'Cairo','Noto Sans Arabic',sans-serif" : "Arial, sans-serif"};padding:10mm}@page{size:${pageSize};margin:8mm}*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}\n      .paper{background:${paper};position:relative;min-height:${certificate ? '185mm' : '267mm'};border:1px solid #cbd5e1;overflow:hidden}\n      .outer{position:absolute;inset:8px;border:2px solid ${navy};pointer-events:none}.inner{position:absolute;inset:16px;border:1px solid ${gold};pointer-events:none}\n      .content{position:relative;padding:${certificate ? '20mm 22mm 16mm' : '18mm 17mm 15mm'};z-index:2}\n      .brand{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}.brand-main{flex:1}.logo{height:52px;width:120px;object-fit:contain}.brand-name{font-size:20px;font-weight:800;color:${navy};letter-spacing:.03em}.brand-sub{font-size:10px;color:#64748b;margin-top:2px}.doc-title{text-align:center;margin:10px 0 8px}.doc-title .en{font-size:${certificate ? '25px' : '22px'};font-weight:800;letter-spacing:.10em;color:${navy}}.doc-title .ar{font-size:${certificate ? '22px' : '20px'};font-weight:800;color:${emerald};margin-top:4px}.rule{height:3px;width:120px;background:${gold};margin:8px auto 0}.intro{text-align:center;color:#475569;font-size:13px;margin:14px auto 6px;max-width:80%}.name{text-align:center;font-size:${certificate ? '30px' : '25px'};font-weight:800;color:${navy};margin:8px 0 12px}.course{text-align:center;font-size:${certificate ? '19px' : '16px'};font-weight:800;color:${emerald};margin:8px auto 14px;max-width:88%}.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.statement{text-align:center;font-size:12px;color:#475569;margin:10px auto 12px;line-height:1.7}.signatures{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-top:20px}.sig{border-top:1px solid #9ca3af;padding-top:7px;text-align:center;font-size:10px;color:#64748b}.footer{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-top:16px;border-top:1px solid #e2e8f0;padding-top:9px;font-size:9px;color:#64748b}.seal{width:72px;height:72px;border:2px solid ${gold};border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;font-size:9px;font-weight:800;color:${gold};margin:0 auto}.qr{width:88px;height:88px;object-fit:contain;border:1px solid #d1d5db;padding:5px;background:#fff}.license-note{padding:10px 12px;background:#f8fafc;border:1px solid #dbe4ea;border-radius:10px;font-size:11px;line-height:1.7;color:#475569;margin-top:10px}\n    </style></head><body><div class="paper"><div class="outer"></div><div class="inner"></div><div class="content">\n      <div class="brand" style="direction:${dir2}">\n        <div class="brand-main" style="text-align:${align2}"><div class="brand-name">${escapeHtml(siteName)}</div>${branding.departmentName ? `<div class="brand-sub">${escapeHtml(branding.departmentName)}</div>` : ''}${branding.safetyDepartmentName ? `<div class="brand-sub">${escapeHtml(branding.safetyDepartmentName)}</div>` : ''}</div>\n        ${branding.companyLogo ? `<img class="logo" src="${escapeHtml(branding.companyLogo)}" alt="${escapeHtml(siteName)}">` : `<div class="seal">${certificate ? (isAr ? 'تدريب\nمعتمد' : 'TRAINING\nCERTIFIED') : (isAr ? 'ترخيص\nرسمي' : 'OFFICIAL\nLICENSE')}</div>`}\n      </div>\n      <div class="doc-title"><div class="en">${labels.en}</div><div class="ar">${labels.ar}</div><div class="rule"></div></div>\n      ${certificate ? `<div class="intro">${isAr ? labels.introAr : labels.introEn}</div>` : `<div class="statement">${isAr ? labels.introAr : labels.introEn}</div>`}\n      <div class="name">${escapeHtml(name || (isAr ? 'اسم المتدرب / الموظف' : 'Participant / License Holder'))}</div>\n      ${certificate ? `<div class="statement">${isAr ? labels.courseAr : labels.courseEn}</div><div class="course">${escapeHtml(course || item.title)}</div>` : `<div class="course">${escapeHtml(course || item.title)}</div>`}\n      <div class="fields">\n        ${field('Employee ID','الرقم الوظيفي',employeeId)}\n        ${field('Department','القسم',dept)}\n        ${license && jobTitle ? field('Job Title','المسمى الوظيفي',jobTitle) : ''}\n        ${field(certificate ? 'Trainer / Issuer' : 'Issuing Authority', certificate ? 'المدرب / الجهة المصدرة' : 'جهة الإصدار',issuer)}\n        ${field('Issue Date','تاريخ الإصدار',issueDate)}\n        ${field(certificate ? 'Training Duration' : 'Expiry Date', certificate ? 'مدة التدريب' : 'تاريخ الانتهاء',certificate ? (duration || expiryDate) : expiryDate)}\n        ${field('Status','الحالة',status || (certificate ? 'PASSED & VERIFIED' : item.status || 'VALID'))}\n        ${remarks ? field('Remarks','الملاحظات',remarks,true) : ''}\n      </div>\n      ${certificate ? '' : '<div class="license-note">'+escapeHtml(isAr ? 'هذه الرخصة صالحة ضمن نطاق العمل المحدد، ويجب عدم استخدامها بعد تاريخ الانتهاء أو خارج نطاق الصلاحية الممنوح.' : 'This license is valid only within the stated scope and must not be used after the expiry date or outside the authorized scope.')+'</div>'}\n      <div class="signatures"><div class="sig">${isAr ? 'التوقيع المعتمد' : 'Authorized Signature'}<br><strong>${isAr ? 'مسؤول السلامة / HSE Manager' : 'HSE Manager / Safety Officer'}</strong></div><div class="sig">${isAr ? 'اعتماد الإدارة' : 'Management Approval'}<br><strong>${isAr ? 'الجهة المصدرة' : 'Issuing Authority'}</strong></div></div>\n      <div class="footer"><div><strong>${escapeHtml(item.refNo || '')}</strong><br>${isAr ? 'رقم المستند / الشهادة' : 'Document / Certificate No.'}</div><div style="text-align:center"><img class="qr" src="${officialQrUrl}" alt="QR"><div style="font-size:8px;margin-top:2px">${isAr ? 'رمز التحقق' : 'Verification QR'}</div></div><div style="text-align:${isAr ? 'left' : 'right'}">${isAr ? 'تم الإصدار إلكترونيًا' : 'Electronically issued'}<br>${new Date().toLocaleDateString(isAr ? 'ar-SA' : 'en-US')}</div></div>\n    </div></div></body></html>`;\n  };\n'''

          if marker not in s:
              raise SystemExit('marker not found in print-share-dialog.tsx')
          s = s.replace(marker, marker + insert, 1)

          old = '  const html = buildPrintHtml(item, settings.siteName, isAr, settings);'
          new = '  const html = (isOfficialLicense || isTrainingCertificate) ? buildOfficialDocumentHtml() : buildPrintHtml(item, settings.siteName, isAr, settings);'
          if old not in s:
              raise SystemExit('print html call not found')
          s = s.replace(old, new, 1)

          # Make the inline preview use the same official template look without rewriting the whole component.
          preview_marker = '  return (\n    <div \n      className="print-content bg-white p-5 text-gray-900"'
          preview_insert = '''  if (isOfficialLicense || isTrainingCertificate) {\n    const isCert = isTrainingCertificate;\n    const titleEn = isCert ? "CERTIFICATE OF TRAINING" : "OFFICIAL LICENSE / PERMIT";\n    const titleAr = isCert ? "شهادة إتمام تدريب" : "رخصة / تصريح رسمي";\n    const name = getOfficialSection(isCert ? ["trainee name", "اسم المتدرب"] : ["employee name", "اسم الموظف"]);\n    const course = getOfficialSection(isCert ? ["course title", "اسم الدورة"] : ["license category", "نوع الترخيص", "license name", "مسمى الترخيص"]);\n    return (\n      <div className="bg-white p-6 text-slate-900" style={{ maxWidth: isCert ? "960px" : "760px", margin: "0 auto", direction: dir, fontFamily: isAr ? "'Cairo','Noto Sans Arabic',sans-serif" : "Arial, sans-serif" }}>\n        <div style={{ border: "2px solid #17324d", outline: "1px solid #b88928", outlineOffset: "6px", padding: "28px", textAlign: "center", minHeight: isCert ? "620px" : "820px" }}>\n          <div className="flex items-start justify-between gap-4" style={{ flexDirection: isAr ? "row-reverse" : "row" }}>\n            <div className="text-start"><div className="text-xl font-extrabold tracking-wide text-[#17324d]">{siteName}</div><div className="text-[10px] text-slate-500">{branding.departmentName || branding.safetyDepartmentName || "Safety & Compliance"}</div></div>\n            {branding.companyLogo ? <img src={branding.companyLogo} alt={siteName} style={{ width: "120px", height: "56px", objectFit: "contain" }} /> : <div className="rounded-full border-2 border-[#b88928] px-3 py-2 text-[9px] font-bold text-[#b88928]">{isCert ? "TRAINING CERTIFIED" : "OFFICIAL LICENSE"}</div>}\n          </div>\n          <div className="mt-5 text-2xl font-extrabold tracking-[.12em] text-[#17324d]">{titleEn}</div>\n          <div className="mt-1 text-xl font-extrabold text-emerald-700">{titleAr}</div>\n          <div className="mx-auto mt-2 h-1 w-28 bg-[#b88928]" />\n          <div className="mt-7 text-sm text-slate-500">{isCert ? (isAr ? "تشهد الجهة المصدرة بأن" : "This is to certify that") : (isAr ? "تشهد هذه الوثيقة بأهلية حاملها" : "This document certifies the holder")}</div>\n          <div className="mt-3 text-3xl font-extrabold text-[#17324d]">{name || (isAr ? "الاسم" : "Name")}</div>\n          <div className="mt-4 text-lg font-bold text-emerald-700">{course || item.title}</div>\n          <div className="mt-6 grid grid-cols-2 gap-3 text-start">{item.sections.map((section, idx) => <div key={idx} className="rounded-lg border bg-slate-50 p-3"><div className="text-[10px] font-bold uppercase text-slate-500">{section.label}</div><div className="mt-1 text-xs font-semibold">{section.value || "—"}</div></div>)}</div>\n          <div className="mt-7 grid grid-cols-2 gap-10"><div className="border-t pt-2 text-[10px] text-slate-500">{isAr ? "التوقيع المعتمد" : "Authorized Signature"}</div><div className="border-t pt-2 text-[10px] text-slate-500">{isAr ? "اعتماد الإدارة" : "Management Approval"}</div></div>\n          <div className="mt-6 flex items-end justify-between gap-4 border-t pt-3 text-[9px] text-slate-500">\n            <div className="font-mono font-bold">{item.refNo}</div>\n            <img src={officialQrUrl} alt="QR" style={{ width: "76px", height: "76px" }} />\n            <div>{new Date().toLocaleDateString(isAr ? "ar-SA" : "en-US")}</div>\n          </div>\n        </div>\n      </div>\n    );\n  }\n\n'''
          if preview_marker not in s:
              raise SystemExit('preview marker not found')
          s = s.replace(preview_marker, preview_insert + preview_marker, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify
        run: |
          grep -n 'isOfficialLicense\|CERTIFICATE OF TRAINING\|OFFICIAL LICENSE / PERMIT' src/components/print-share-dialog.tsx src/pages/admin/licenses.tsx src/pages/admin/trainings.tsx
          npm ci
          npm run build
      - name: Commit and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/print-share-dialog.tsx src/pages/admin/licenses.tsx src/pages/admin/trainings.tsx
          git commit -m 'feat: redesign official license and training certificate printing' || true
          git push
          git rm .github/workflows/rework-official-documents.yml
          git commit -m 'chore: remove temporary official documents workflow' || true
          git push
