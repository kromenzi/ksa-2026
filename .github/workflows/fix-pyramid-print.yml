name: Fix Safety Pyramid Print

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-pyramid-print:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply native pyramid print handler
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          page = Path("src/pages/admin/safety-pyramid.tsx")
          snippet = Path("scripts/pyramid-print-handler.txt").read_text(encoding="utf-8")
          text = page.read_text(encoding="utf-8")

          if "SAFETY_PYRAMID_NATIVE_PRINT_V3" in text:
              print("Native pyramid print V3 already installed")
              raise SystemExit(0)

          start_marker = "  const handlePrint = () => {"
          end_marker = "  const exportCSV = () => {"
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit("Could not locate safety pyramid handlePrint block")

          text = text[:start] + snippet + "\n" + text[end:]
          page.write_text(text, encoding="utf-8")
          print("Installed native visual Safety Pyramid print handler")
          PY

      - name: Commit source patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/safety-pyramid.tsx
          if git diff --cached --quiet; then
            echo "No source changes"
            exit 0
          fi
          git commit -m "fix: print actual safety pyramid shape"
          git push