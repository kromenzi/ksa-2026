name: Apply incidents escalation fix

on:
  push:
    branches:
      - fix/incidents-near-miss-escalation
    paths:
      - scripts/fix-incidents-escalation.py
      - .github/workflows/apply-incidents-escalation-fix.yml

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/incidents-near-miss-escalation
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply incident escalation patch
        run: python scripts/fix-incidents-escalation.py
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Commit generated source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/incidents.tsx 'api/escalations/[id].ts'
          if git diff --cached --quiet; then
            echo "No generated source changes to commit"
          else
            git commit -m "fix: create real incident and near-miss escalations"
            git push origin HEAD:fix/incidents-near-miss-escalation
          fi
