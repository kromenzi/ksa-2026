name: Apply UTEC Safety Board branding

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  branding:
    if: ${{ !contains(github.event.head_commit.message, '[skip utec branding]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace board branding in application sources
        shell: bash
        run: |
          set -euo pipefail
          files="$(find src -type f \( -name '*.ts' -o -name '*.tsx' -o -name '*.css' -o -name '*.md' \) -print)"
          files="$files index.html"
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            sed -i 's/ABDULKAREM SAFETY BOARD/UTEC SAFETY BOARD/g' "$file"
          done <<< "$files"

          while IFS= read -r file; do
            [ -f "$file" ] || continue
            sed -i 's#"/logo\.png"#"/utec-logo.svg"#g' "$file"
            sed -i "s#'/logo\.png'#'/utec-logo.svg'#g" "$file"
          done <<< "$files"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No UTEC branding changes required."
            exit 0
          fi

          git add src index.html
          git commit -m "Apply UTEC Safety Board branding [skip utec branding]"
          git push
