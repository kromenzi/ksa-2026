name: Repair Pyramid Print V8

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace both pyramid print engines
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          component = Path('src/components/incident-pyramid.tsx')
          text = component.read_text(encoding='utf-8')
          start = text.find('function openStandalonePyramidPrint(')
          end = text.find('\n\nexport function IncidentPyramid', start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate IncidentPyramid standalone printer')

          new_component = r'''function openStandalonePyramidPrint({
            year, monthName, monthlyCounts, ytdCounts, isAr
          }: {
            year: number; monthName: string; monthlyCounts: Record<string, number>; ytdCounts: Record<string, number>; isAr: boolean;
          }) {
            const title = isAr ? `الهرم الأمني للمنشأة - ${year}` : `Incident Pyramid - ${year}`;
            const subtitle = isAr ? `${monthName} ${year} مقابل التراكمي YTD` : `${monthName} ${year} vs YTD`;
            const monthTitle = isAr ? `الشهر • ${monthName}` : `Monthly • ${monthName}`;
            const ytdTitle = isAr ? `التراكمي YTD • ${year}` : `YTD • ${year}`;
            const generated = new Date().toLocaleString(isAr ? 'ar-SA' : 'en-US');
            const widthMap: Record<string, number> = { fatality: 24, lostTime: 36, restrictedWork: 48, medicalTreatment: 60, firstAid: 72, nearMiss: 84, unsafeActs: 96 };
            const colorMap: Record<string, string> = { fatality: '#dc2626', lostTime: '#f43f5e', restrictedWork: '#f97316', medicalTreatment: '#f59e0b', firstAid: '#facc15', nearMiss: '#34d399', unsafeActs: '#059669' };
            const renderRows = (counts: Record<string, number>) => PYRAMID_LEVEL_DEFS.map((lvl) => {
              const label = isAr ? lvl.shortNameAr : lvl.shortNameEn;
              const count = counts[lvl.id] ?? 0;
              const textColor = ['medicalTreatment', 'firstAid', 'nearMiss'].includes(lvl.id) ? '#0f172a' : '#fff';
              return `<div class="row"><div class="bar" style="width:${widthMap[lvl.id]}%;background:${colorMap[lvl.id]};color:${textColor}">${escapeHtml(label)}</div><span class="count">${count}</span></div>`;
            }).join('');
            const totalMonth = ['fatality', 'lostTime', 'restrictedWork', 'medicalTreatment', 'firstAid'].reduce((s, id) => s + (monthlyCounts[id] ?? 0), 0);
            const totalYtd = ['fatality', 'lostTime', 'restrictedWork', 'medicalTreatment', 'firstAid'].reduce((s, id) => s + (ytdCounts[id] ?? 0), 0);
            const printHtml = `<!doctype html><html lang="${isAr ? 'ar' : 'en'}" dir="${isAr ? 'rtl' : 'ltr'}"><head><meta charset="utf-8"><title>${escapeHtml(title)}</title><style>
          @page{size:A4 landscape;margin:10mm}*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;color:#0f172a;font-family:Arial,"Segoe UI",sans-serif}body{padding:10mm;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}.page{width:100%}.head{padding-bottom:5mm;border-bottom:2px solid #0f172a;margin-bottom:5mm}.head h1{font-size:23px;margin:0 0 2mm;font-weight:800}.head p{margin:0;color:#475569;font-size:10px}.meta{margin-top:2mm;color:#64748b;font-size:9px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:4mm;margin-bottom:5mm}.kpi{border:1px solid #cbd5e1;border-radius:7px;padding:3mm;text-align:center}.kpi strong{display:block;font-size:17px}.kpi span{font-size:8px;color:#64748b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6mm}.panel{border:1px solid #cbd5e1;border-radius:9px;padding:5mm}.panel h2{text-align:center;color:#1e3a8a;font-size:14px;margin:0}.panel p{text-align:center;color:#64748b;font-size:9px;margin:2mm 0 4mm}.rows{display:flex;flex-direction:column;gap:3mm}.row{position:relative;min-height:10mm;display:flex;align-items:center;justify-content:center}.bar{height:8mm;border-radius:4px;display:flex;align-items:center;justify-content:center;padding:0 2mm;font-size:9px;font-weight:800;text-align:center}.count{position:absolute;inset-inline-end:0;font:900 12px ui-monospace,SFMono-Regular,Consolas,monospace}.footer{margin-top:5mm;padding-top:3mm;border-top:1px solid #cbd5e1;display:flex;justify-content:space-between;color:#64748b;font-size:7px}
          </style></head><body><main class="page"><header class="head"><h1>${escapeHtml(title)}</h1><p>${escapeHtml(subtitle)}</p><div class="meta">HSE-PYRAMID-01 • ${escapeHtml(generated)}</div></header><section class="summary"><div class="kpi"><strong>${totalMonth}</strong><span>${isAr ? 'إجمالي الإصابات والحوادث للشهر' : 'Monthly Incident Cases'}</span></div><div class="kpi"><strong>${monthlyCounts.nearMiss ?? 0}</strong><span>${isAr ? 'Near Miss للشهر' : 'Monthly Near Misses'}</span></div><div class="kpi"><strong>${monthlyCounts.unsafeActs ?? 0}</strong><span>${isAr ? 'السلوكيات والظروف غير الآمنة' : 'Monthly Unsafe Acts/Conditions'}</span></div><div class="kpi"><strong>${totalYtd}</strong><span>${isAr ? 'إجمالي الإصابات والحوادث YTD' : 'YTD Incident Cases'}</span></div></section><section class="grid"><article class="panel"><h2>${escapeHtml(monthTitle)}</h2><p>${isAr ? 'المستويات والأعداد الشهرية' : 'Monthly levels and counts'}</p><div class="rows">${renderRows(monthlyCounts)}</div></article><article class="panel"><h2>${escapeHtml(ytdTitle)}</h2><p>${isAr ? 'المستويات والأعداد التراكمية' : 'Year-to-date levels and counts'}</p><div class="rows">${renderRows(ytdCounts)}</div></article></section><footer class="footer"><span>ABDULKAREM SAFETY BOARD</span><span>${isAr ? 'تقرير هرم الحوادث' : 'Incident Pyramid Report'}</span></footer></main></body></html>`;

            const iframe = document.createElement('iframe');
            iframe.setAttribute('aria-hidden', 'true');
            iframe.style.position = 'fixed';
            iframe.style.right = '0';
            iframe.style.bottom = '0';
            iframe.style.width = '1px';
            iframe.style.height = '1px';
            iframe.style.border = '0';
            iframe.style.opacity = '0';
            iframe.style.pointerEvents = 'none';
            document.body.appendChild(iframe);
            const frameDoc = iframe.contentDocument;
            const frameWin = iframe.contentWindow;
            if (!frameDoc || !frameWin) {
              iframe.remove();
              window.print();
              return;
            }
            frameDoc.open();
            frameDoc.write(printHtml);
            frameDoc.close();
            const cleanup = () => window.setTimeout(() => iframe.remove(), 1000);
            window.setTimeout(() => {
              try {
                frameWin.focus();
                frameWin.print();
                cleanup();
              } catch {
                iframe.remove();
                window.print();
              }
            }, 300);
          }'''
          component.write_text(text[:start] + new_component + text[end:], encoding='utf-8')

          page = Path('src/pages/admin/safety-pyramid.tsx')
          text = page.read_text(encoding='utf-8')
          start = text.find('  const openPrintWindow = (mode: "report" | "image") => {')
          end = text.find('\n\n\n  return (', start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate safety-pyramid print handler')

          new_page = r'''  const openPrintWindow = (mode: "report" | "image") => {
    const report = mode === "report";
    const esc = (value: unknown) => String(value ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch] || ch));
    const pyramid = (data: Record<LevelId, number>) => LEVELS.map((level, i) => enabled[level.id] ? `<div class="row"><div class="bar" style="width:${24 + i * 12}%;background:${level.color};color:${level.text}"><span>${esc(isAr ? level.ar : level.en)}</span><b>${data[level.id] ?? 0}</b></div></div>` : "").join("");
    const html = `<!doctype html><html lang="${isAr ? "ar" : "en"}" dir="${isAr ? "rtl" : "ltr"}"><head><meta charset="utf-8"><title>${esc(report ? "Incident Pyramid Report" : "Incident Pyramid")}</title><style>
@page{size:A4 landscape;margin:10mm}*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;color:#111827;font-family:Arial,"Segoe UI",sans-serif}body{padding:10mm;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}.header{text-align:center;border-bottom:3px solid #dc2626;padding-bottom:5mm;margin-bottom:6mm}.header h1{margin:0;font-size:24px}.header p{margin:2mm 0;color:#64748b;font-size:11px}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:5mm;margin-bottom:6mm}.kpi{border:1px solid #cbd5e1;border-radius:8px;padding:4mm;text-align:center}.kpi b{display:block;font-size:22px}.kpi span{display:block;color:#64748b;font-size:10px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:7mm}.card{border:1px solid #cbd5e1;border-radius:10px;padding:6mm}.card h2{text-align:center;margin:0 0 4mm;font-size:16px;color:#1e3a8a}.row{height:12mm;display:flex;align-items:center;justify-content:center}.bar{height:9mm;border-radius:4px;display:flex;align-items:center;justify-content:space-between;padding:0 3mm;font-size:10px;font-weight:800}.bar b{font-size:12px}.total{text-align:center;border-top:1px solid #cbd5e1;margin-top:4mm;padding-top:3mm;font-size:10px;font-weight:700}.footer{margin-top:7mm;padding-top:3mm;border-top:1px solid #cbd5e1;display:flex;justify-content:space-between;color:#64748b;font-size:8px}
</style></head><body><div class="header"><h1>${esc(isAr ? `هرم الحوادث - ${selectedYear}` : `Incident Pyramid - ${selectedYear}`)}</h1><p>${esc(isAr ? `مقارنة ${monthName} مع التراكمي ${selectedYear}` : `Monthly ${monthName} vs YTD ${selectedYear}`)}</p></div>${report ? `<div class="kpis"><div class="kpi"><b>${monthTotal}</b><span>${esc(isAr ? `إجمالي ${monthName}` : `Total ${monthName}`)}</span></div><div class="kpi"><b>${counts.monthly.nearMiss}</b><span>${esc(isAr ? "الوقائع الوشيكة" : "Near Misses")}</span></div><div class="kpi"><b>${counts.monthly.unsafeActs}</b><span>${esc(isAr ? "السلوكيات والظروف غير الآمنة" : "At-Risk / Unsafe")}</span></div></div>` : ""}<div class="columns"><section class="card"><h2>${esc(isAr ? `الشهر • ${monthName}` : `Monthly • ${monthName}`)}</h2>${pyramid(counts.monthly)}${report ? `<div class="total">${monthTotal} ${esc(isAr ? "إجمالي السجلات" : "total records")}</div>` : ""}</section><section class="card"><h2>${esc(isAr ? `التراكمي YTD • ${selectedYear}` : `YTD • ${selectedYear}`)}</h2>${pyramid(counts.ytd)}${report ? `<div class="total">${ytdTotal} ${esc(isAr ? "إجمالي السجلات" : "total records")}</div>` : ""}</section></div><div class="footer"><span>ABDULKAREM SAFETY BOARD</span><span>${report ? "Incident Pyramid Report" : "Incident Pyramid"}</span></div></body></html>`;

    const iframe = document.createElement("iframe");
    iframe.setAttribute("aria-hidden", "true");
    Object.assign(iframe.style, { position: "fixed", right: "0", bottom: "0", width: "1px", height: "1px", border: "0", opacity: "0", pointerEvents: "none" });
    document.body.appendChild(iframe);
    const frameDoc = iframe.contentDocument;
    const frameWin = iframe.contentWindow;
    if (!frameDoc || !frameWin) {
      iframe.remove();
      toast.error(isAr ? "تعذر تجهيز صفحة الطباعة" : "Could not prepare print page");
      return;
    }
    frameDoc.open();
    frameDoc.write(html);
    frameDoc.close();
    window.setTimeout(() => {
      try {
        frameWin.focus();
        frameWin.print();
      } finally {
        window.setTimeout(() => iframe.remove(), 1000);
      }
    }, 300);
    logActivity(report ? "Print Incident Pyramid Report" : "Print Incident Pyramid Image", `Printed ${monthName} ${selectedYear}`, "reports");
  };'''
          page.write_text(text[:start] + new_page + text[end:], encoding='utf-8')
          PY

      - name: Verify source
        run: |
          grep -q 'document.createElement("iframe")' src/pages/admin/safety-pyramid.tsx
          grep -q 'document.createElement('\''iframe'\'')' src/components/incident-pyramid.tsx
          grep -q 'frameWin.print()' src/pages/admin/safety-pyramid.tsx
          grep -q 'frameWin.print()' src/components/incident-pyramid.tsx

      - name: Commit repaired printers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/safety-pyramid.tsx src/components/incident-pyramid.tsx
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix: print pyramid through hidden iframe"
          git push
