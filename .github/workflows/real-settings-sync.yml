name: Settings Backend Sync
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[settings-sync]') && !contains(github.event.head_commit.message, '[diagnostics-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply real diagnostics wiring
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/pages/admin/settings.tsx')
          s = p.read_text(encoding='utf-8')
          marker = 'const handleRunSystemDiagnostics = async () => {'
          if marker not in s:
              start = s.find('  const handleRunSystemDiagnostics = () => {')
              if start < 0:
                  raise SystemExit('diagnostics function not found')
              end = s.find('\n  };', start)
              if end < 0:
                  raise SystemExit('diagnostics function end not found')
              end += len('\n  };')
              old = s[start:end]
              new = '''  const handleRunSystemDiagnostics = async () => {\n    setIsScanning(true);\n    toast.info(isAr ? "جاري فحص الخدمات وقاعدة البيانات فعلياً..." : "Running live system diagnostics against APIs and Supabase...");\n    try {\n      const response = await fetch("/api/system-health", { credentials: "include" });\n      const payload = await response.json().catch(() => ({}));\n      const services = payload?.services || {};\n      const healthy = !!payload?.ok;\n      const failedServices = Object.values(services).filter((svc: any) => svc?.state === "offline").length;\n      const overall = healthy ? 100 : Math.max(0, 100 - failedServices * 25);\n      setScanResults({ brokenPages: 0, brokenButtons: 0, brokenLinks: 0, brokenPrint: 0, brokenPdf: 0, brokenQr: 0, dbIntegrityScore: services.supabase?.state === "online" ? 100 : 0, overallHealthPct: overall, scannedAt: new Date().toLocaleTimeString() });\n      if (!response.ok || !healthy) toast.error(isAr ? "اكتمل الفحص، وتم اكتشاف خدمة تحتاج إلى مراجعة" : "Diagnostics completed and detected a service requiring attention");\n      else toast.success(isAr ? "اكتمل الفحص الفعلي بنجاح" : "Live diagnostics completed successfully");\n    } catch (e: any) {\n      setScanResults({ brokenPages: 0, brokenButtons: 0, brokenLinks: 0, brokenPrint: 0, brokenPdf: 0, brokenQr: 0, dbIntegrityScore: 0, overallHealthPct: 0, scannedAt: new Date().toLocaleTimeString() });\n      toast.error(e?.message || (isAr ? "تعذر تنفيذ الفحص الفعلي" : "Unable to run live diagnostics"));\n    } finally { setIsScanning(false); }\n  };'''
              s = s[:start] + new + s[end:]
          s = s.replace("<span>{scanResults ? `${scanResults.overallHealthPct}%` : '100%'} Healthy</span>", "<span>{scanResults ? `${scanResults.overallHealthPct}%` : 'Not checked'}</span>")
          p.write_text(s, encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/admin/settings.tsx
          git commit -m 'fix: wire settings diagnostics to live system health [settings-sync]'
          git push
