name: Fix Pyramid Print V5

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply same-page print patch
        shell: bash
        run: |
          python3 scripts/fix-pyramid-print-v5.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/pages/admin/safety-pyramid.tsx')
          s=p.read_text(encoding='utf-8')
          old='''<div className="hidden print:block bg-white text-slate-900 min-h-screen p-0" dir={isAr ? "rtl" : "ltr"}>'''
          new='''<div style={{display: isNativePrinting ? "block" : "none"}} className="bg-white text-slate-900 min-h-screen p-0" dir={isAr ? "rtl" : "ltr"}>'''
          if old not in s:
              raise SystemExit('print root marker missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY

      - name: Verify source
        run: |
          grep -q 'same-page print, no popup window' src/pages/admin/safety-pyramid.tsx
          grep -q 'style={{display: isNativePrinting ? "block" : "none"}}' src/pages/admin/safety-pyramid.tsx
          grep -q 'window.print()' src/pages/admin/safety-pyramid.tsx
          grep -q 'window.open' src/pages/admin/safety-pyramid.tsx && exit 1 || true

      - name: Commit source patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/admin/safety-pyramid.tsx scripts/fix-pyramid-print-v5.py .github/workflows/fix-pyramid-print-v5.yml
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix: make safety pyramid print on same page"
          git push
