name: Move Overview First

on:
  push:
    paths:
      - '.github/workflows/move-overview-first.yml'

jobs:
  reorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move Overview group before ESP group
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/components/layouts/admin-layout.tsx')
          s = p.read_text(encoding='utf-8')
          start = s.index('  const navGroups: NavGroup[] = [')
          prefix = s[:start]
          tail = s[start:]

          def grab(title):
              marker = f'    {{\n      title: "{title}",'
              a = tail.index(marker)
              b = tail.find('\n    {\n      title:', a + len(marker))
              if b == -1:
                  raise SystemExit(f'End marker not found for {title}')
              return a, b, tail[a:b]

          esp_a, esp_b, esp_block = grab('ESP Safety Vision')
          ov_a, ov_b, ov_block = grab('Overview')

          if not (esp_a < ov_a):
              print('Overview is already first; no change needed')
              raise SystemExit(0)

          between = tail[esp_b:ov_a]
          new_tail = tail[:esp_a] + ov_block + between + esp_block + tail[ov_b:]
          p.write_text(prefix + new_tail, encoding='utf-8')
          PY
      - name: Verify order
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('src/components/layouts/admin-layout.tsx').read_text(encoding='utf-8')
          start = s.index('  const navGroups: NavGroup[] = [')
          a = s.index('title: "Overview"', start)
          b = s.index('title: "ESP Safety Vision"', start)
          assert a < b, 'Overview is not before ESP Safety Vision'
          print('Verified: Overview is first navigation group')
          PY
      - name: Commit and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/layouts/admin-layout.tsx
          git commit -m 'fix: put overview navigation first'
          git push
          git rm .github/workflows/move-overview-first.yml
          git commit -m 'chore: remove temporary navigation workflow'
          git push
